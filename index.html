/* Layout: app a schermo fisso con scene (tutorial, home, domanda, fine sezione,
   PDF, impaginazione). Pulsanti puliti; ogni sezione è una scheda editoriale con
   una foto coerente. I quadri servono solo come sfondo tenue del PDF. */
:root{
  --bg:#faf8f4; --surface:#ffffff; --sunk:#f2eee7; --line:#e6e0d6;
  --ink:#1d1b26; --soft:#5b5766; --faint:#767280;
  --brand:#3046b8; --brand-deep:#24359a;
  --ok:#15803d;
  --f-titolo:"Bricolage EP","Bricolage Grotesque",system-ui,sans-serif;
  --f-testo:"Figtree EP","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --molla:cubic-bezier(.34,1.56,.64,1);
  --morbido:cubic-bezier(.22,1,.36,1);
  --c:#3046b8; --deep:#24359a;
  --app-h:100dvh; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-testo);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
::selection{background:color-mix(in srgb,var(--c) 32%,transparent)}
input,textarea{caret-color:var(--deep)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,var(--ink));outline-offset:3px;border-radius:12px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--f-titolo);font-weight:700;letter-spacing:-.02em;text-wrap:balance;margin:0}
.icon{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* ---------- Palcoscenico e transizioni ---------- */
#stage{position:fixed;left:0;right:0;top:0;height:var(--app-h);overflow:hidden;overflow:clip;perspective:2000px}
.scena{position:absolute;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;background:var(--bg)}
.entra-dx{animation:entraDx .55s var(--morbido) both}
.entra-sx{animation:entraSx .55s var(--morbido) both}
.entra-su{animation:entraSu .6s var(--morbido) both}
.esce-dx{animation:esceDx .4s var(--morbido) both}
.esce-sx{animation:esceSx .4s var(--morbido) both}
.esce-su{animation:esceGiu .35s var(--morbido) both}
@keyframes entraDx{from{transform:translateX(60px);opacity:0}}
@keyframes entraSx{from{transform:translateX(-60px);opacity:0}}
@keyframes entraSu{from{transform:translateY(40px) scale(.98);opacity:0}}
@keyframes esceDx{to{transform:translateX(-60px);opacity:0}}
@keyframes esceSx{to{transform:translateX(60px);opacity:0}}
@keyframes esceGiu{to{transform:scale(.97);opacity:0}}
/* pagina che si gira */
.gira{transform-origin:0 50%;animation:gira .95s cubic-bezier(.55,.06,.3,1) both;box-shadow:0 0 60px rgba(0,0,0,.25)}
.gira::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.28));animation:ombra .95s ease-in both;pointer-events:none;z-index:9}
@keyframes gira{0%{transform:rotateY(0)}100%{transform:rotateY(-104deg)}}
@keyframes ombra{from{opacity:0}to{opacity:1}}
.sotto-pagina{animation:sottoPagina .95s ease-out both}
@keyframes sottoPagina{from{filter:brightness(.82)}}

/* ---------- Forme dipinte ---------- */
.forme{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.blob{position:absolute;background:var(--c);opacity:.12!important;border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;animation:morph 14s ease-in-out infinite alternate}
.blob.b2{animation-duration:18s;animation-direction:alternate-reverse}
@keyframes morph{
  0%{border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;transform:rotate(0)}
  33%{border-radius:63% 37% 38% 62% / 55% 61% 39% 45%}
  66%{border-radius:37% 63% 52% 48% / 38% 46% 54% 62%}
  100%{border-radius:55% 45% 33% 67% / 62% 35% 65% 38%;transform:rotate(20deg)}}
.scena > :not(.forme){position:relative;z-index:1}

/* ---------- Pulsanti ---------- */
.btn{--b:var(--deep);position:relative;min-height:56px;padding:0 26px;border-radius:16px;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;color:#fff;background:var(--b);box-shadow:0 10px 22px -14px color-mix(in srgb,var(--b) 90%,#000),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .25s var(--molla),box-shadow .3s,filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn[disabled]{filter:grayscale(1) opacity(.45);cursor:not-allowed;transform:none}
.btn.brand{--b:var(--brand-deep)}
.btn.chiaro{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),0 8px 20px -16px rgba(0,0,0,.35)}
.btn.chiaro:hover{box-shadow:inset 0 0 0 1.5px var(--faint),0 8px 20px -16px rgba(0,0,0,.35);filter:none}
.btn.piccolo{min-height:44px;padding:0 18px;font-size:15px;border-radius:13px}
.link{font-weight:500;font-size:15px;color:var(--soft);padding:10px 12px;border-radius:12px;display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--ink);background:var(--sunk)}
.tondo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--soft);transition:background .2s,color .2s;flex:none}
.tondo:hover{background:var(--sunk);color:var(--ink)}

/* ---------- Simboli ---------- */
.simbolo{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Tutorial ---------- */
.tut{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:560px;width:100%;margin:0 auto}
.tut-top{display:flex;justify-content:space-between;padding-top:12px}
.tut-privacy{margin:0!important;font-size:13px!important;color:var(--faint)!important;line-height:1.4}
.tut-privacy a{color:var(--soft);text-decoration:underline;text-underline-offset:2px}
.tut-privacy .icon{width:15px;height:15px;color:var(--brand);display:inline-block;vertical-align:-3px;margin-right:3px}
.btn.carica{pointer-events:none}.btn.carica > *{opacity:.35}
.btn.carica::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:ruota .8s linear infinite}
@keyframes ruota{to{transform:rotate(360deg)}}
.tut-corpo{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;min-height:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;padding-block:8px}
.tut-corpo::-webkit-scrollbar{display:none}
.scena{overflow:hidden}
.tut-ill{width:min(260px,62vw,30dvh);aspect-ratio:1;position:relative;flex:none}
.tut-corpo h1{font-size:clamp(28px,7.5vw,38px);line-height:1.1}
.tut-corpo p{margin:0;color:var(--soft);font-size:17px;max-width:44ch}
.tut-corpo .sotto{font-size:14px;color:var(--faint);margin-top:-12px}
.tut-piede{display:grid;gap:18px;padding-block:14px 22px}
.puntini{display:flex;gap:8px;justify-content:center}
.puntini i{width:10px;height:10px;border-radius:10px;background:var(--line);transition:width .45s var(--molla),background .3s}
.puntini i.on{width:30px;background:var(--brand)}
.tut-piede .btn{width:100%}
.anim-in > *{animation:sbuca .7s var(--molla) both}
.anim-in > *:nth-child(2){animation-delay:.08s}.anim-in > *:nth-child(3){animation-delay:.16s}.anim-in > *:nth-child(4){animation-delay:.24s}
@keyframes sbuca{from{transform:translateY(18px) scale(.96);opacity:0}}
.ill-carte{position:absolute;inset:0;transform:translateY(6%)}

.ill-foto .icon{width:38%;height:38%;stroke-width:1.6}

/* ---------- Home: tutto in una schermata, stessa impostazione su telefono e computer ---------- */

.tondo-nav{width:42px;height:42px;margin-block:-3px;border-radius:50%;display:grid;place-items:center;color:var(--soft);background:var(--surface);box-shadow:0 1px 0 var(--line),0 6px 14px -10px rgba(29,27,38,.4);transition:transform .25s var(--molla),color .2s,background .2s}

.pallini button{width:30px;height:30px;display:grid;place-items:center}

.pallini button:last-child i{width:calc(8px + 16px * var(--p))}
.pallini button[aria-selected="true"] i{background:var(--brand)}
.pannelli{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pannelli::-webkit-scrollbar{display:none}
.pannello{flex:0 0 100%;min-width:0;min-height:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column}
.home{flex:1;min-height:0;overflow-y:auto;width:100%;display:flex;flex-direction:column;gap:12px;padding-top:12px;padding-bottom:10px}

/* ---- anteprima del PDF ---- */
.carta{background:#fff;color:#1d1b26;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06),0 22px 40px -28px rgba(29,27,38,.45)}

.c-eti{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#82808a}

.c-testo{display:flow-root;margin-top:12px}
.c-frase{margin:0 0 12px;font-style:italic;font-size:15px;line-height:1.45;position:relative;padding-left:26px}

.c-img{display:block;overflow:hidden;margin:4px 0 8px}
.c-img.uno{width:44%}
.c-img.dx{float:right;margin-left:12px}.c-img.sx{float:left;margin-right:12px}
.c-img img,.c-griglia img{width:100%;height:100%;object-fit:cover;display:block}
.c-img.f-tondo{border-radius:50%}.c-img.f-quadrato{border-radius:2px}.c-img.f-smussato{border-radius:9px}
.c-griglia{clear:both;display:grid;gap:5px;margin:10px 0 6px}

.c-griglia.n3{grid-template-columns:62fr 38fr;grid-template-rows:1fr 1fr}

.c-sez.vuota .c-testata{opacity:.5}
.c-vuota{margin:8px 0 0;font-size:12.5px;color:#a7a2ad;font-style:italic}
.c-nota{background:#f7f3ec;border-radius:10px;padding:14px;font-size:12px;font-style:italic;color:#5b5766;line-height:1.5}
.testata{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;flex:none}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--faint);overflow:hidden;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--line);transition:transform .3s var(--molla)}

.avatar.ok{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--brand)}

.riepilogo{flex:none;background:var(--surface);border-radius:20px;padding:10px 10px 10px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;box-shadow:0 1px 0 var(--line),0 20px 40px -30px rgba(29,27,38,.4)}

.sez{min-height:0;display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--surface);border-radius:18px;padding:6px 6px 8px;box-shadow:0 1px 0 var(--line),0 12px 24px -20px rgba(29,27,38,.45);transition:transform .35s var(--molla),box-shadow .3s;animation:sbuca .7s var(--molla) both;animation-delay:calc(var(--i) * 45ms)}
.sez:hover{transform:translateY(-2px);box-shadow:0 1px 0 var(--line),0 18px 28px -20px rgba(29,27,38,.55)}

const ESP = "Che cosa è accaduto? Perché è importante? Che cosa ti ha lasciato?";
/* Aiutini: domande brevi ed esempi per sbloccare chi fatica a cominciare */
const AIUTINI = {
  presentazioneBreve:{ d:["Se dovessi presentarti in dieci secondi, cosa diresti?","Cosa fai quando non studi?","Da dove vieni, e cosa ti porti dietro?"], e:"Vengo da un paese di montagna e ho sempre fatto da guida ai più piccoli: adesso voglio farlo per mestiere." },
  parole:{ d:["Come ti descriverebbe la persona che ti conosce meglio?","Quale parola usi per il tuo modo di affrontare un problema?","Pensa a un pregio e a un difetto: valgono entrambi."], e:"curiosa, paziente, testarda, ironica, disordinata" },
  aspettoImportante:{ d:["Cosa ti mette in difficoltà più spesso di quanto vorresti?","C'è un tratto di te che gli altri fraintendono?","Cosa hai imparato a gestire con il tempo?"], e:"Sono molto timida: per anni ho evitato di parlare in pubblico. Ho imparato a prepararmi e a chiedere aiuto, e oggi la timidezza mi rende più attenta a chi resta in silenzio." },
  esperienza:{ d:["Un viaggio, un lavoro, un incontro, una perdita: cosa ti torna in mente per primo?","In quale momento hai sentito di essere cambiata o cambiato?","Chi c'era con te, e cosa è successo dopo?"], e:"L'estate da animatrice al centro estivo: un bambino non parlava con nessuno. Alla fine del mese mi ha regalato un disegno. Ho capito che il tempo dedicato agli altri torna sempre indietro." },
  citazione:{ d:["Una frase che hai sottolineato in un libro o salvato sul telefono?","Il verso di una canzone che canti spesso?","Una frase detta da una persona importante per te?"], e:"«Aiutami a fare da solo.» — Maria Montessori" },
  commentoCitazione:{ d:["Quando l'hai letta o sentita la prima volta?","In quale situazione ti è tornata in mente?","Cosa ti dice oggi, che allora non ti diceva?"], e:"L'ho letta al primo anno: mi ha fatto capire che aiutare non vuol dire sostituirsi all'altro, ma dargli gli strumenti." },
  lezionePersona:{ d:["Un nonno, un allenatore, un'amica, un collega: chi ti viene in mente?","Cosa faceva o diceva che ti è rimasto?","Lo fai anche tu, oggi?"], e:"Mia nonna, che ascoltava senza interrompere mai. Da lei ho imparato che a volte la cosa più utile è stare in silenzio." },
  lezioneErrore:{ d:["Uno sbaglio di cui all'inizio ti vergognavi?","Cosa hai fatto dopo, per rimediare?","Cosa fai di diverso da allora?"], e:"Ho consegnato un lavoro di gruppo senza ascoltare gli altri. Il voto era buono, il gruppo no. Da allora chiedo il parere di tutti prima di decidere." },
  lezioneDifficile:{ d:["Un periodo in cui le cose non andavano come speravi?","Su chi o su cosa hai potuto contare?","Cosa hai scoperto di te?"], e:"L'anno in cui ho cambiato città da sola. Mi sono sentita persa, poi ho scoperto di sapermela cavare più di quanto pensassi." },
  lezioneScuola:{ d:["Una materia, una gita, un compito che ricordi ancora?","Qualcosa che la scuola ti ha insegnato senza volerlo?","Cosa avresti voluto imparare e non hai imparato?"], e:"Ho imparato che sbagliare davanti a tutti non è la fine del mondo: la maestra rideva con noi, mai di noi." },
  superRisorsa:{ d:["Per cosa ti chiedono aiuto gli amici?","In quale situazione dai il meglio di te?","Quando te ne sei accorta o accorto la prima volta?"], e:"So mettere ordine nel caos: quando un gruppo si perde, sono io a fare la lista delle cose da fare. L'ho scoperto organizzando la festa di fine anno." },
  sceltaInsegnante:{ d:["C'è stato un momento preciso in cui hai pensato «voglio fare questo»?","Chi ti ha ispirato, anche senza saperlo?","Avevi altri piani? Cosa ti ha fatto cambiare strada?"], e:"Facevo ripetizioni ai bambini del mio palazzo. Vedere uno di loro capire le frazioni grazie a una pizza disegnata mi ha fatto pensare: è questo che voglio fare." },
  esperienzaScolastica:{ d:["Un giorno di scuola che ricordi come fosse ieri?","Ti ricordi come ti sentivi?","Perché credi che ti sia rimasto in mente?"], e:"In terza elementare abbiamo coltivato un orto in cortile. Era la prima volta che la scuola mi sembrava un posto vivo." },
  insegnanteRicordo:{ d:["Un insegnante che ti ha fatto sentire vista o visto, o al contrario ignorata o ignorato?","Cosa faceva in classe di diverso dagli altri?","Una frase che ripeteva spesso?"], e:"La professoressa di lettere delle medie leggeva ad alta voce ogni mattina. Non interrogava sui libri: ci chiedeva cosa ci avevano fatto provare." },
  portareCambiare:{ d:["Cosa della tua scuola vorresti rivedere nella tua classe?","Cosa invece non vorresti mai ripetere?","Una piccola cosa concreta che cambieresti da domani?"], e:"Vorrei portare la cura per il cortile e i lavori manuali. Vorrei cambiare le interrogazioni a sorpresa, che mettono paura invece di aiutare a imparare." },
  significatoInsegnare:{ d:["Se dovessi spiegarlo a un bambino, cosa diresti?","Insegnare è più dare risposte o fare domande?","Cosa ti rende fiera o fiero quando spieghi qualcosa a qualcuno?"], e:"Insegnare per me vuol dire accendere la curiosità: non riempire di risposte, ma far venire voglia di cercarle." },
  apprendimentoClasse:{ d:["Pensa a una volta in cui hai imparato davvero: cosa c'era intorno a te?","Cosa serve: silenzio, movimento, errori, gioco?","Come capisci che qualcuno ha capito?"], e:"Ci vuole fiducia: i bambini imparano quando possono sbagliare senza paura e quando quello che fanno ha un senso per loro." },
  ruoloResponsabilita:{ d:["Di cosa è responsabile un insegnante, oltre al programma?","Verso chi: alunni, famiglie, colleghi?","Cosa ti spaventa di questa responsabilità?"], e:"L'insegnante è responsabile del clima della classe: deve far sentire ognuno al sicuro, accolto e capace." },
  relazioneAlunni:{ d:["Come vorresti che ti ricordassero i tuoi alunni tra vent'anni?","Quanto vicina o vicino vuoi essere, e quanto distante?","Cosa farai il primo giorno per conoscerli?"], e:"Una relazione di fiducia: vorrei che ogni bambino sapesse che può venire da me, anche quando ha sbagliato." },
  risorseProfessione:{ d:["Cosa sai fare bene, anche fuori dalla scuola?","Un lavoro, uno sport, un hobby che ti ha insegnato qualcosa di utile?","Cosa dicono di te le compagne e i compagni di corso?"], e:"Anni di scout mi hanno insegnato a gestire gruppi numerosi e a inventare giochi con poco. Credo che in classe sarà utilissimo." },
  crescita:{ d:["In cosa ti senti ancora alle prime armi?","Cosa ti piacerebbe saper fare tra cinque anni?","Su cosa ti chiedono un consiglio che non sai ancora dare?"], e:"Vorrei imparare a gestire i conflitti tra bambini senza alzare la voce, e a usare meglio le tecnologie in classe." },
  difficolta:{ d:["Quale situazione in classe ti mette ansia solo a immaginarla?","Un bambino che non ascolta, un genitore arrabbiato, una lezione che non funziona?","Come pensi di reagire, oggi?"], e:"Mi preoccupa un genitore che contesta le mie scelte davanti agli altri. Credo che mi servirà imparare a restare calma e a spiegare il perché." },

  domanda:{ d:["Cosa non ti è ancora chiaro di questo mestiere?","Una domanda che faresti a una maestra con trent'anni di esperienza?","Una domanda su di te, come futura insegnante o futuro insegnante?"], e:"Come si fa a non perdere nessuno, in una classe di venticinque bambini?" }

/* finestra a comparsa riutilizzabile: X sempre visibile, resta dentro lo schermo */
function finestra(etichetta, icona, html){
  const velo = document.createElement("div"); velo.className = "velo aiuto-velo";
  velo.innerHTML = `<div class="pop" role="dialog" aria-modal="true"><div class="pop-testa"><span class="pop-eti">${ico(icona)} ${esc(etichetta)}</span><button class="pop-x" aria-label="Chiudi">${ico("x")}</button></div><div class="pop-corpo">${html}</div></div>`;
  const esci = e => { if (e.key === "Escape"){ e.stopPropagation(); chiudi(); } };
  const chiudi = () => { velo.remove(); document.removeEventListener("keydown", esci, true); };
  velo.onclick = e => { if (e.target === velo) chiudi(); };
  $(".pop-x", velo).onclick = chiudi;
  document.addEventListener("keydown", esci, true);
  document.body.appendChild(velo);
  return { velo, chiudi };
}
function apriIndice(si, pi){
  const z = SEZ[si];
  const f = finestra("Indice", "lista", `<h2>${z.n}. ${esc(z.titolo)}</h2><div class="indice-lista">${z.passi.map((q, i) => `<button data-i="${i}" class="${i === pi ? "qui" : ""}" ${i === pi ? 'aria-current="step"' : ""}><b>${passoFatto(q) ? ico("check") : i + 1}</b><span>${q.sopra && /\d$/.test(q.titolo) ? esc(q.titolo) : esc(q.titolo)}</span></button>`).join("")}</div>`);
  f.velo.style.setProperty("--deep", z.deep);
  f.velo.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { f.chiudi(); const i = +b.dataset.i; if (i !== pi) vDomanda(si, i, i > pi ? "dx" : "sx"); });
  const qui = $(".qui", f.velo); if (qui) qui.scrollIntoView({ block:"center" }); else $(".pop-x", f.velo).focus();
}
/* modifica al volo di un testo dall'anteprima: è lo stesso dato delle sezioni */
function apriTesto(k, poi){
  const t = k === "nome" ? { titolo:"Nome e cognome", tipo:"riga" } : k === "annoCorso" ? { titolo:"Anno di corso", tipo:"riga" } : trovaPasso(k)?.p;
  if (!t) return;
  const v = esc(S.campi[k] || "");
  const f = finestra("Modifica", "matita", `<h2>${esc(t.titolo)}</h2>${t.tipo === "riga" ? `<input class="pop-campo" type="text" value="${v}" aria-label="${esc(t.titolo)}">` : `<textarea class="pop-campo" rows="7" aria-label="${esc(t.titolo)}">${v}</textarea>`}<div class="riga-pop"><button class="btn chiaro piccolo" data-annulla>Annulla</button><button class="btn brand piccolo" data-salva>${ico("check")} <span>Salva</span></button></div>`);
  const campo = $(".pop-campo", f.velo); campo.focus();
  $("[data-annulla]", f.velo).onclick = f.chiudi;
  $("[data-salva]", f.velo).onclick = () => { S.campi[k] = campo.value; salva(true); f.chiudi(); poi(); };
}
function trovaPasso(key){ for (const z of SEZ) for (const q of z.passi) if (q.key === key) return { s:z, p:q }; return null; }
function apriAiutino(p){

      <div class="pop-es"><b>Per esempio</b><p>${esc(a.e)}</p></div></div></div>`;
  const chiudi = () => { velo.remove(); document.removeEventListener("keydown", esci, true); const b = $("#q-aiutino"); if (b) b.focus(); };
  const esci = e => { if (e.key === "Escape"){ e.stopPropagation(); chiudi(); } };
  velo.onclick = e => { if (e.target === velo) chiudi(); };
  $(".pop-x", velo).onclick = chiudi;
  document.addEventListener("keydown", esci, true);
  document.body.appendChild(velo); $(".pop-x", velo).focus();
}

/* altezza reale dello schermo, anche con la tastiera aperta */
(function(){
  const v = window.visualViewport, st = document.documentElement.style;
  const adatta = () => { if (!v) return; st.setProperty("--app-h", v.height + "px"); $("#stage").style.transform = v.offsetTop ? `translateY(${v.offsetTop}px)` : ""; };
  if (v){ v.addEventListener("resize", adatta); v.addEventListener("scroll", adatta); adatta(); }
})();

/* =========================================================================
   Scene con transizione
   ========================================================================= */
let scenaCorrente = null;
function mostra(html, verso = "su", sezione = null){
  chiudiTip();
  const stage = $("#stage");
  const nuova = document.createElement("div");
  nuova.className = "scena";
  if (sezione) sezioneSu(nuova, sezione);
  nuova.innerHTML = html;
  const vecchia = scenaCorrente;
  if (verso === "pagina" && vecchia && !ridotto){
    stage.insertBefore(nuova, vecchia);
    nuova.classList.add("sotto-pagina");
    vecchia.style.zIndex = 2; vecchia.style.pointerEvents = "none"; vecchia.classList.add("gira");
    setTimeout(() => vecchia.remove(), 980);
  } else {
    stage.appendChild(nuova);
    if (!ridotto && verso !== "nessuno"){
      nuova.classList.add(verso === "dx" ? "entra-dx" : verso === "sx" ? "entra-sx" : "entra-su");
      if (vecchia){ vecchia.classList.add(verso === "dx" ? "esce-dx" : verso === "sx" ? "esce-sx" : "esce-su"); vecchia.style.pointerEvents = "none"; setTimeout(() => vecchia.remove(), 420); }
    } else if (vecchia) vecchia.remove();
  }
  scenaCorrente = nuova;
  return nuova;
}

/* =========================================================================
   Tutorial
   ========================================================================= */
function illustrazione(tipo){

  return sc;

function scorrimento(el, avanti, indietro){
  el._frecce = { avanti, indietro };
  let x0 = null, y0 = 0;
  const via = (x, y, t) => { if (t && t.closest && t.closest("textarea,input")) return; x0 = x; y0 = y; };
  const fine = (x, y) => { if (x0 === null) return; const dx = x - x0, dy = y - y0; x0 = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) (dx < 0 ? avanti : indietro)(); };
  el.addEventListener("touchstart", e => via(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive:true });
  el.addEventListener("touchend", e => fine(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive:true });
  el.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") via(e.clientX, e.clientY, e.target); });
  el.addEventListener("pointerup", e => { if (e.pointerType === "mouse") fine(e.clientX, e.clientY); });
}

function prossimoPasso(){
  for (let s = 0; s < SEZ.length; s++) for (let p = 0; p < SEZ[s].passi.length; p++) if (!passoFatto(SEZ[s].passi[p])) return { s, p };
  return { s:0, p:0 };
}
/* conferma a due bottoni; restituisce true se si sceglie "sì" */
function chiedi(testo, si, no, pericolo){
  return new Promise(fine => {
    const velo = document.createElement("div"); velo.className = "velo";
    velo.innerHTML = `<div class="conferma" role="alertdialog" aria-modal="true"><p>${esc(testo)}</p><div class="riga"><button class="btn chiaro piccolo" data-no><span>${esc(no)}</span></button><button class="btn piccolo" ${pericolo ? 'style="--b:#b42f25"' : ""} data-si><span>${esc(si)}</span></button></div></div>`;
    document.body.appendChild(velo);
    const chiudi = r => { velo.remove(); fine(r); };
    $("[data-no]", velo).onclick = () => chiudi(false);
    $("[data-si]", velo).onclick = () => chiudi(true);
    velo.onclick = e => { if (e.target === velo) chiudi(false); };
    $("[data-no]", velo).focus();
  });
}

  const fine = () => { g.remove(); removeEventListener("resize", posa); S.visto.giro = true; salva(true); if (pan) vai(0); };
  const posa = () => {
    const passo = GIRO[i], el = $(passo.sel, sc); if (!el) return;
    let r = el.getBoundingClientRect();
    const vis = { t:Math.max(8, r.top), b:Math.min(innerHeight - 8, r.bottom) };
    const m = 6, top = vis.t - m, h = Math.max(30, vis.b - vis.t) + m * 2;
    Object.assign(luce.style, { top: top + "px", left: (r.left - m) + "px", width: (r.width + m * 2) + "px", height: h + "px" });
    const bh = bolla.offsetHeight, sotto = top + h + 12 + bh < innerHeight - 8, sopra = top - bh - 12 > 8;
    bolla.style.top = (sotto ? top + h + 12 : sopra ? top - bh - 12 : innerHeight - bh - 16) + "px";
  };
  const mostraPasso = () => {
    const passo = GIRO[i];
    $(".giro-n", g).textContent = `${i + 1} / ${GIRO.length}`;
    $(".giro-t", g).textContent = (API && (S.utente ? passo.tl : passo.to)) || passo.t;
    $(".giro-avanti span", g).textContent = i === GIRO.length - 1 ? "Fine" : "Avanti";
    const attesa = passo.pan !== pan ? 500 : 0;
    if (attesa){ pan = passo.pan; vai(pan); }
    bolla.classList.remove("su"); void bolla.offsetWidth;
    setTimeout(() => { posa(); bolla.classList.add("su"); $(".giro-avanti", g).focus({ preventScroll:true }); }, attesa);
    if (attesa){ setTimeout(posa, attesa + 300); setTimeout(posa, attesa + 700); }
  };
  $(".giro-avanti", g).onclick = () => { if (i < GIRO.length - 1){ i++; mostraPasso(); } else fine(); };
  $(".giro-salta", g).onclick = fine; $(".giro-x", g).onclick = fine;
  addEventListener("resize", posa);
  mostraPasso();
}

/* anteprima leggibile del PDF: stessa impostazione, si riempie man mano */
function anteprima(){
  const foto = vistaFoto(), nome = (S.campi.nome || "").trim(), anno = (S.campi.annoCorso || "").trim(), frase = (S.campi.presentazioneBreve || "").trim();
  const pp = PAROLE.map(k => (S.campi[k] || "").trim()).filter(Boolean);
  const immagini = (q) => {
    const voci = lista(q.key); if (!voci.length) return "";
    if (voci.length === 1){ const it = voci[0]; return `<button class="c-img uno ${q.posto.lato} f-${it.forma}" data-img="${q.key}:0" aria-label="Sistema l'immagine" style="aspect-ratio:${rapportoDi(it.forma, q.posto)}"><img src="${it.vista || it.data}" alt=""></button>`; }
    return `<span class="c-griglia n${voci.length}">${voci.map((it, n) => `<button data-img="${q.key}:${n}" aria-label="Sistema l'immagine ${n + 1}"><img src="${it.vista || it.data}" alt=""></button>`).join("")}</span>`;
  };
  const sezione = z => {
    const piene = chiaviSez(z).filter(k => !NON_IN_CORPO.includes(k)).some(ha) || (z.n === 1 && frase);
    let corpo = "", sopra = null;
    if (z.n === 1 && frase) corpo += `<p class="c-frase" data-k="presentazioneBreve" role="button" tabindex="0">${esc(frase)}</p>`;
    const ancore = {}; z.passi.forEach(q => { if (q.tipo === "immagine" && q.ancora && lista(q.key).length && ha(q.ancora)) ancore[q.ancora] = q; });
    const messe = new Set();
    for (const p of z.passi){
      if (p.tipo === "foto" || p.tipo === "parole" || NON_IN_CORPO.includes(p.key)) continue;
      if (p.tipo === "immagine"){ if (!messe.has(p.key)) corpo += immagini(p); continue; }
      const v = (S.campi[p.key] || "").trim(); if (!v) continue;
      const an = ancore[p.key], fila = an && lista(an.key).length > 1;
      if (an && !fila){ corpo += immagini(an); messe.add(an.key); }
      if (p.sopra && p.sopra !== sopra){ corpo += `<p class="c-sopra">${esc(p.sopra)}</p>`; sopra = p.sopra; }
      corpo += `<p class="c-q">${esc(p.titolo)}</p><p class="c-a ${p.key === "citazione" ? "cit" : ""}" data-k="${p.key}" role="button" tabindex="0">${esc(v)}</p>`;
      if (fila){ corpo += immagini(an); messe.add(an.key); }
    }
    return `<div class="c-sez ${piene ? "" : "vuota"}" style="--c:${z.c};--deep:${z.deep}">
      <div class="c-testata"><div><b>${String(z.n).padStart(2, "0")}</b><span>${esc(z.titolo)}</span></div><img src="${fotoSez(z.n)}" style="filter:url(#duo-${z.n})" alt=""></div>
      ${piene ? `<div class="c-testo">${corpo}</div>` : `<button class="c-vuota" data-vai="${z.n - 1}">Ancora vuota</button>`}</div>`;
  };
  return `<p class="ant-nota">${ico("matita")} Tocca un testo o un'immagine per modificarli.</p><div class="carta" aria-label="Anteprima del PDF">
    <div class="c-fascia"><button class="c-foto" data-img="foto" aria-label="Sistema la foto">${foto ? `<img src="${foto}" alt="">` : ""}</button>
      <div><div class="c-eti">${esc(TESTI.titolo)}</div><div class="c-nome ${nome ? "" : "segnaposto"}" data-k="nome" role="button" tabindex="0">${esc(nome || "Nome e cognome")}</div>
      <div class="c-anno" data-k="annoCorso" role="button" tabindex="0">${esc(anno ? anno + " · " + TESTI.sottotitolo : TESTI.sottotitolo)}</div>
      ${pp.length ? `<div class="c-pp">${pp.map((w, i) => { const z = SEZ[i % SEZ.length]; return `<span style="--c:${z.c};color:${z.deep}">${esc(w)}</span>`; }).join("")}</div>` : ""}</div></div>
    <div class="c-corpo">${SEZ.map(sezione).join("")}<div class="c-nota">${esc(TESTI.notaFinale)}</div></div>
  </div>`;
}

function coriandoli(){
  if (ridotto) return;
  const cv = $("#coriandoli"), x = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const col = SEZ.map(s => s.c);
  const pezzi = Array.from({ length:110 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 60, y: innerHeight * .34,
    vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    w: 6 + Math.random() * 7, h: 4 + Math.random() * 5, c: col[(Math.random() * col.length) | 0], tondo: Math.random() < .35
  }));
  const t0 = performance.now();
  (function frame(t){
    const dt = Math.min(2, (t - (frame.ult || t)) / 16.7); frame.ult = t;
    x.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of pezzi){
      p.vy += .36 * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      if (p.tondo){ x.beginPath(); x.arc(0, 0, p.h * .8, 0, 7); x.fill(); } else x.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      x.restore();
    }
    if (t - t0 < 2500) requestAnimationFrame(frame); else x.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

async function offri(nome, blob){

    const dl = await window.claude.use("downloads").catch(() => null);
    if (dl){ try { await dl.save({ filename:nome, data:blob }); return "ok"; } catch(err){ return err && err.code === "declined" ? "annullato" : "errore"; } }
  }
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 30000); return "ok";
}

const TTF = {};
function ttf(nome){
  return TTF[nome] || (TTF[nome] = fetch(`assets/${nome}.ttf`).then(r => { if (!r.ok) throw new Error("lib"); return r.arrayBuffer(); }).then(b => {
    const u = new Uint8Array(b); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s);

}

const caricaImg = src => new Promise((ok, ko) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ko; im.src = src; });
async function ritaglio(src, rapp, raggio = 0, maxW = 1200){
  const im = await caricaImg(src); let sw = im.width, sh = im.height, sx = 0, sy = 0;
  if (rapp){ if (sw / sh > rapp){ sw = sh * rapp; sx = (im.width - sw) / 2; } else { sh = sw / rapp; sy = (im.height - sh) * .35; } }
  const w = Math.min(maxW, Math.round(sw)), h = Math.round(w * sh / sw), c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h);
  if (raggio){ const r = raggio * w; x.beginPath(); x.roundRect(0, 0, w, h, r); x.clip(); }
  x.drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
  return { data:c.toDataURL("image/jpeg", .88), w, h };
}
/* ritaglio scelto dall'utente: zoom z (1 = riempie la cornice) e centro cx, cy (0-1) */
function rettangolo(iw, ih, r, c){
  let sw, sh; if (iw / ih > r){ sh = ih; sw = sh * r; } else { sw = iw; sh = sw / r; }
  sw /= c.z; sh /= c.z;
  const sx = Math.min(Math.max(c.cx * iw - sw / 2, 0), iw - sw), sy = Math.min(Math.max(c.cy * ih - sh / 2, 0), ih - sh);
  return { sx, sy, sw, sh };
}
function forma(x, f, w, h, raggio = .06){
  x.beginPath();
  if (f === "tondo") x.arc(w / 2, h / 2, Math.min(w, h) / 2, 0, Math.PI * 2);
  else if (f === "smussato") x.roundRect(0, 0, w, h, w * raggio);
  else x.rect(0, 0, w, h);
  x.clip();
}

      let w = Math.min(mw, mh * rr), h = w / rr; cor.style.width = w + "px"; cor.style.height = h + "px";
      cor.style.borderRadius = f === "tondo" ? "50%" : f === "smussato" ? "6%/" + (6 * rr) + "%" : "4px";

const cacheSfondo = {};
async function sfondoLavato(k){

function simboloPng(n, colore, lato = 160){
  const c = document.createElement("canvas"); c.width = c.height = lato; const x = c.getContext("2d");
  x.fillStyle = colore; x.beginPath(); x.arc(lato/2, lato/2, lato/2, 0, 7); x.fill();
  x.save(); const k = lato * .6 / 24; x.translate(lato * .2, lato * .2); x.scale(k, k);

/* ---------- elementi grafici del PDF, disegnati al momento ---------- */
const PXMM = 8; // risoluzione delle immagini generate: 8 pixel per millimetro
const cacheDuo = {};
async function illustrazioneDuo(s){
  if (cacheDuo[s.n]) return cacheDuo[s.n];
  const im = await caricaImg(fotoSez(s.n)), c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
  const x = c.getContext("2d"); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), q = d.data, a = rgb(s.deep), b = mix(s.c, .14);
  for (let i = 0; i < q.length; i += 4){ const l = (q[i] * .3 + q[i+1] * .59 + q[i+2] * .11) / 255; q[i] = a[0] + (b[0] - a[0]) * l; q[i+1] = a[1] + (b[1] - a[1]) * l; q[i+2] = a[2] + (b[2] - a[2]) * l; }
  x.putImageData(d, 0, 0);
  return (cacheDuo[s.n] = c);
}
function contieni(x, im, bx, by, bw, bh){ const k = Math.min(bw / im.width, bh / im.height), w = im.width * k, h = im.height * k; x.drawImage(im, bx + (bw - w) / 2, by + (bh - h) / 2, w, h); }
/* riquadro colorato con l'illustrazione in bicromia (testata di sezione) */
async function riquadroSez(s, wmm, hmm, area, raggio = 3.5){
  const c = document.createElement("canvas"); c.width = Math.round(wmm * PXMM); c.height = Math.round(hmm * PXMM); const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.beginPath(); x.roundRect(0, 0, c.width, c.height, raggio * PXMM); x.fillStyle = hex(mix(s.c, .14)); x.fill();
  const [ax, ay, aw, ah] = area.map((v, i) => v * (i % 2 ? c.height : c.width));
  contieni(x, await illustrazioneDuo(s), ax, ay, aw, ah);
  return c.toDataURL("image/jpeg", .9);
}

        chiudiFloat();
        if (voci.length === 1){
          const it = voci[0], r = rapportoDi(it.forma, q.posto), w = it.forma === "smussato" ? q.posto.w : Math.min(q.posto.w, 54), h = w / r;
          if (y + h > BASSO) nuova();
          doc.addImage(await immagineFinale(it, r, it.forma, 1000, true, 3 / w), "PNG", q.posto.lato === "sx" ? M : W - M - w, y + .8, w, h, undefined, "FAST");
          fl = { fondo: y + .8 + h + 4, w, lato: q.posto.lato };
          return;
        }
        /* più immagini: celle rettangolari con angoli smussati, il ritaglio scelto resta al centro */
        const gap = 3, celle = [];
        if (voci.length === 2){ const w = (CW - gap) / 2, h = w * .72; celle.push([M, 0, w, h], [M + w + gap, 0, w, h]); }
        else { const H3 = 78, wb = CW * .62, ws = CW - wb - gap, hs = (H3 - gap) / 2; celle.push([M, 0, wb, H3], [M + wb + gap, 0, ws, hs], [M + wb + gap, hs + gap, ws, hs]); }
        const alt = Math.max(...celle.map(c => c[1] + c[3]));
        if (y + alt > BASSO) nuova();
        for (let n = 0; n < celle.length; n++){
          const [cx, cy, cw, ch] = celle[n];
          doc.addImage(await immagineFinale(voci[n], cw / ch, "smussato", Math.round(cw * 9), true, 3 / cw), "PNG", cx, y + cy, cw, ch, undefined, "FAST");
        }
        y += alt + 8;
      };
      for (const p of s.passi){
        if (p.tipo === "foto" || p.tipo === "parole" || NON_IN_CORPO.includes(p.key)) continue;
        if (p.tipo === "immagine"){ await metti(p); continue; }
        const v = (S.campi[p.key] || "").trim(); if (!v) continue;
        const an = ancore[p.key], fila = an && lista(an.key).length > 1;
        if (an && !fila){ serve(40); await metti(an); }
        if (p.sopra && p.sopra !== ultimoSopra){
          serve(lh(12) + lh(9.5) + lh(10.5) * 2 + 4); y += 1;
          doc.setFillColor(...rgb(s.c)); doc.roundedRect(x0(), y + 1.3, 2.6, 2.6, .6, .6, "F");
          scrivi(p.sopra, { font:"Titolo", size:12, col:INK, x:x0() + 5, larg:disponibile() - 5, dopo:2 }); ultimoSopra = p.sopra;
        }
        if (p.key === "citazione"){
          serve(lh(9.5) + lh(13) * 2 + 4);
          scrivi(p.titolo, { st:"bold", size:9.5, col:D2, dopo:1.2 });
          const y0 = y; doc.setFont("Titolo","normal"); doc.setFontSize(40); doc.setTextColor(...mix(s.c, .55)); doc.text("“", x0() - .5, y0 + 11);
          scrivi(v, { st:"italic", size:13, col:INK, x:x0() + 11, larg:disponibile() - 11, dopo:6 });
          continue;
        }
        doc.setFont("Testo","normal"); doc.setFontSize(10.5);
        const alto = lh(9.5) + 1 + v.split("\n").reduce((n, par) => n + Math.max(1, doc.splitTextToSize(par, CW - RIENTRO - (accanto() ? fl.w + STACCO : 0)).length), 0) * lh(10.5);
        serve(alto < 70 ? alto : lh(9.5) + lh(10.5) * 3);
        scrivi(p.titolo, { st:"bold", size:9.5, col:D2, dopo:1 });
        barra = tinta; scrivi(v, { size:10.5, col:INK, dopo:0 }); barra = null; y += 6;
        if (fila) await metti(an);
      }
      chiudiFloat();
    }

    /* ===== Chiusura ===== */
    doc.setFont("Testo","italic"); doc.setFontSize(10);
    const nl = doc.splitTextToSize(TESTI.notaFinale, CW - 20), bh = nl.length * lh(10) + 16;
    if (y + bh + 6 > BASSO) nuova();
    y += 4; doc.setFillColor(...CREMA); doc.roundedRect(M, y, CW, bh, 4, 4, "F");
    SEZ.forEach((z, i) => { doc.setFillColor(...rgb(z.c)); doc.circle(M + 10 + i * 3.4, y + 7, 1.15, "F"); });
    doc.setTextColor(...SOFT); nl.forEach((r, i) => doc.text(r, M + 10, y + 14.5 + i * lh(10)));

    const file = `profilo-personale${nome ? "-" + slug(nome) : ""}.pdf`;
    const blob = doc.output("blob");
    const r = modo === "condividi" ? await condividi(file, blob) : await offri(file, blob);
    es.className = r === "errore" ? "esito err" : "esito";
    es.textContent = r === "ok" ? file : r === "annullato" ? "" : modo === "condividi" ? "Non è stato possibile condividere il PDF. Prova a scaricarlo." : "Non è stato possibile scaricare il PDF. Riprova.";
    if (r === "ok") coriandoli();
  } catch(err){
    console.error(err); es.className = "esito err";
    es.textContent = err && err.message === "lib" ? "Connessione assente: il PDF non si può generare ora. Riprova tra poco." : "Non è stato possibile generare il PDF. Riprova.";
  } finally { btn.disabled = false; btn.innerHTML = etich; }
}

/* =========================================================================
   Suggerimenti sul posto
   ========================================================================= */
let tipAttivo = null;
function chiudiTip(){ if (!tipAttivo) return; tipAttivo.el.remove(); tipAttivo.target.classList.remove("evidenzia"); tipAttivo = null; }
function tip(target, testo, poi){
  if (!target) return; chiudiTip();
  const el = document.createElement("div");
  el.className = "tip"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", testo);
  el.innerHTML = `<span>${esc(testo)}</span><button>Ho capito</button>`;
  document.body.appendChild(el);
  target.classList.add("evidenzia");
  const r = target.getBoundingClientRect(), tw = el.offsetWidth, th = el.offsetHeight;
  const sotto = r.bottom + th + 20 < innerHeight;
  const left = Math.min(Math.max(12, r.left + r.width / 2 - tw / 2), innerWidth - tw - 12);
  el.style.left = left + "px";
  el.style.top = Math.max(12, sotto ? r.bottom + 14 : r.top - th - 14) + "px";
  el.classList.add(sotto ? "sotto" : "sopra");
  el.style.setProperty("--ax", Math.min(tw - 26, Math.max(12, r.left + r.width / 2 - left - 7)) + "px");
  tipAttivo = { el, target };
  el.querySelector("button").onclick = () => { chiudiTip(); if (poi) poi(); };
  el.querySelector("button").focus({ preventScroll:true });
}
addEventListener("resize", chiudiTip);

addEventListener("load", () => setTimeout(libLibero, 1500));

  else if (API && !S.utente && !S.ospite) vAccesso("nessuno");
  else vHome("nessuno");
  setTimeout(allineaAllAvvio, 300);
  setTimeout(preparaFont, 1500);
});
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\./.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
