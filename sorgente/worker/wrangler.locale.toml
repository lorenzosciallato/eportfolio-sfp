# Solo per le prove sul computer (npx wrangler dev -c wrangler.locale.toml --local)
name = "eportfolio-sfp"
main = "worker.js"
compatibility_date = "2025-09-01"
[[r2_buckets]]
binding = "DATI"
bucket_name = "eportfolio-sfp"
[[ratelimits]]
name = "LIMITE"
namespace_id = "2610"
  [ratelimits.simple]
  limit = 100
  period = 60
[vars]
PEPE = "solo-per-prova-locale"
