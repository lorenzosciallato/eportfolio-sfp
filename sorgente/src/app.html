<title>E-Portfolio SFP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#faf8f4">
<style>
@font-face{font-family:"Bricolage EP";src:url(assets/tit-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Bricolage EP";src:url(assets/tit-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Figtree EP";src:url(assets/txt-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree EP";src:url(assets/txt-400i.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Figtree EP";src:url(assets/txt-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Figtree EP";src:url(assets/txt-600.woff2) format("woff2");font-weight:600;font-display:swap}
/* Layout: app a schermo fisso con scene (tutorial, home, domanda, fine sezione,
   PDF, impaginazione). Pulsanti puliti; ogni sezione è una scheda editoriale con
   una foto coerente. I quadri servono solo come sfondo tenue del PDF. */
:root{
  --bg:#faf8f4; --surface:#ffffff; --sunk:#f2eee7; --line:#e6e0d6;
  --ink:#1d1b26; --soft:#5b5766; --faint:#767280;
  --brand:#3046b8; --brand-deep:#24359a;
  --ok:#15803d;
  --f-titolo:"Bricolage EP","Bricolage Grotesque",system-ui,sans-serif;
  --f-testo:"Figtree EP","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --molla:cubic-bezier(.34,1.56,.64,1);
  --morbido:cubic-bezier(.22,1,.36,1);
  --c:#3046b8; --deep:#24359a;
  --app-h:100dvh; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-testo);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
::selection{background:color-mix(in srgb,var(--c) 32%,transparent)}
input,textarea{caret-color:var(--deep)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,var(--ink));outline-offset:3px;border-radius:12px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--f-titolo);font-weight:700;letter-spacing:-.02em;text-wrap:balance;margin:0}
.icon{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* ---------- Palcoscenico e transizioni ---------- */
#stage{position:fixed;left:0;right:0;top:0;height:var(--app-h);overflow:hidden;overflow:clip;perspective:2000px}
.scena{position:absolute;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;background:var(--bg)}
.entra-dx{animation:entraDx .55s var(--morbido) both}
.entra-sx{animation:entraSx .55s var(--morbido) both}
.entra-su{animation:entraSu .6s var(--morbido) both}
.esce-dx{animation:esceDx .4s var(--morbido) both}
.esce-sx{animation:esceSx .4s var(--morbido) both}
.esce-su{animation:esceGiu .35s var(--morbido) both}
@keyframes entraDx{from{transform:translateX(60px);opacity:0}}
@keyframes entraSx{from{transform:translateX(-60px);opacity:0}}
@keyframes entraSu{from{transform:translateY(40px) scale(.98);opacity:0}}
@keyframes esceDx{to{transform:translateX(-60px);opacity:0}}
@keyframes esceSx{to{transform:translateX(60px);opacity:0}}
@keyframes esceGiu{to{transform:scale(.97);opacity:0}}
/* pagina che si gira */
.gira{transform-origin:0 50%;animation:gira .95s cubic-bezier(.55,.06,.3,1) both;box-shadow:0 0 60px rgba(0,0,0,.25)}
.gira::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.28));animation:ombra .95s ease-in both;pointer-events:none;z-index:9}
@keyframes gira{0%{transform:rotateY(0)}100%{transform:rotateY(-104deg)}}
@keyframes ombra{from{opacity:0}to{opacity:1}}
.sotto-pagina{animation:sottoPagina .95s ease-out both}
@keyframes sottoPagina{from{filter:brightness(.82)}}

/* ---------- Forme dipinte ---------- */
.forme{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.blob{position:absolute;background:var(--c);opacity:.12!important;border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;animation:morph 14s ease-in-out infinite alternate}
.blob.b2{animation-duration:18s;animation-direction:alternate-reverse}
@keyframes morph{
  0%{border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;transform:rotate(0)}
  33%{border-radius:63% 37% 38% 62% / 55% 61% 39% 45%}
  66%{border-radius:37% 63% 52% 48% / 38% 46% 54% 62%}
  100%{border-radius:55% 45% 33% 67% / 62% 35% 65% 38%;transform:rotate(20deg)}}
.scena > :not(.forme){position:relative;z-index:1}

/* ---------- Pulsanti ---------- */
.btn{--b:var(--deep);position:relative;min-height:56px;padding:0 26px;border-radius:16px;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;color:#fff;background:var(--b);box-shadow:0 10px 22px -14px color-mix(in srgb,var(--b) 90%,#000),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .25s var(--molla),box-shadow .3s,filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn[disabled]{filter:grayscale(1) opacity(.45);cursor:not-allowed;transform:none}
.btn.brand{--b:var(--brand-deep)}
.btn.chiaro{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),0 8px 20px -16px rgba(0,0,0,.35)}
.btn.chiaro:hover{box-shadow:inset 0 0 0 1.5px var(--faint),0 8px 20px -16px rgba(0,0,0,.35);filter:none}
.btn.piccolo{min-height:44px;padding:0 18px;font-size:15px;border-radius:13px}
.link{font-weight:500;font-size:15px;color:var(--soft);padding:10px 12px;border-radius:12px;display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--ink);background:var(--sunk)}
.tondo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--soft);transition:background .2s,color .2s;flex:none}
.tondo:hover{background:var(--sunk);color:var(--ink)}

/* ---------- Simboli ---------- */
.simbolo{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Tutorial ---------- */
.tut{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:560px;width:100%;margin:0 auto}
.tut-top{display:flex;justify-content:space-between;padding-top:12px}
.tut-privacy{margin:0!important;font-size:13px!important;color:var(--faint)!important;line-height:1.4}
.tut-privacy a{color:var(--soft);text-decoration:underline;text-underline-offset:2px}
.tut-privacy .icon{width:15px;height:15px;color:var(--brand);display:inline-block;vertical-align:-3px;margin-right:3px}
.btn.carica{pointer-events:none}.btn.carica > *{opacity:.35}
.btn.carica::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:ruota .8s linear infinite}
@keyframes ruota{to{transform:rotate(360deg)}}
.tut-corpo{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;min-height:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;padding-block:8px}
.tut-corpo::-webkit-scrollbar{display:none}
.scena{overflow:hidden}
.tut-ill{width:min(260px,62vw,30dvh);aspect-ratio:1;position:relative;flex:none}
.tut-corpo h1{font-size:clamp(28px,7.5vw,38px);line-height:1.1}
.tut-corpo p{margin:0;color:var(--soft);font-size:17px;max-width:44ch}
.tut-corpo .sotto{font-size:14px;color:var(--faint);margin-top:-12px}
.tut-piede{display:grid;gap:18px;padding-block:14px 22px}
.puntini{display:flex;gap:8px;justify-content:center}
.puntini i{width:10px;height:10px;border-radius:10px;background:var(--line);transition:width .45s var(--molla),background .3s}
.puntini i.on{width:30px;background:var(--brand)}
.tut-piede .btn{width:100%}
.anim-in > *{animation:sbuca .7s var(--molla) both}
.anim-in > *:nth-child(2){animation-delay:.08s}.anim-in > *:nth-child(3){animation-delay:.16s}.anim-in > *:nth-child(4){animation-delay:.24s}
@keyframes sbuca{from{transform:translateY(18px) scale(.96);opacity:0}}
.ill-carte{position:absolute;inset:0;transform:translateY(6%)}
.ill-carte span{position:absolute;left:50%;top:50%;width:46%;height:60%;border-radius:18px;background:#fff center/92% auto no-repeat;border:4px solid var(--surface);box-shadow:0 10px 24px -12px rgba(0,0,0,.5);transform-origin:50% 130%;animation:ventaglio 1.1s var(--morbido) .25s both}
@keyframes ventaglio{from{transform:translate(-50%,-50%) rotate(0deg)}}
.ill-cerchio{position:absolute;inset:8%;border-radius:50%;background:var(--sunk)}
.ill-scheda{position:absolute;left:14%;right:14%;top:22%;bottom:22%;background:var(--surface);border-radius:24px;box-shadow:0 18px 40px -18px rgba(29,27,38,.35);padding:16%;display:grid;align-content:center;gap:10%}
.ill-scheda i{display:block;height:9px;border-radius:9px;background:var(--line)}
.ill-scheda i.barra{background:var(--brand);animation:riempi 2.4s var(--morbido) infinite alternate}
@keyframes riempi{from{clip-path:inset(0 85% 0 0 round 9px)}to{clip-path:inset(0 30% 0 0 round 9px)}}
.ill-cursore{width:3px;height:22px;background:var(--brand);border-radius:2px;animation:lampo 1s steps(1) infinite}
@keyframes lampo{50%{opacity:0}}
.ill-foto{position:absolute;left:50%;top:50%;width:58%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:var(--surface);box-shadow:0 18px 40px -18px rgba(29,27,38,.35);display:grid;place-items:center;color:var(--brand)}
.tut-ill.piccola{width:min(170px,44vw,20dvh)}
button.ill-foto{overflow:hidden;cursor:pointer}
button.ill-foto img{width:100%;height:100%;object-fit:cover}
.tut-campi{display:grid;gap:10px;width:100%;max-width:360px;justify-items:center}
.acc-ill .ill-img{position:absolute;inset:4%;width:92%;height:92%;object-fit:contain}
.accesso .tut-piede{gap:6px}
.acc-ospite{justify-self:center}
.tut-nome{width:100%;font:inherit;font-size:17px;text-align:center;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.tut-nome:focus{outline:none;border-color:var(--brand)}
.ill-foto .icon{width:38%;height:38%;stroke-width:1.6}
.ill-anello{position:absolute;inset:6%;border-radius:50%;border:4px dashed color-mix(in srgb,var(--brand) 45%,transparent);animation:giro 18s linear infinite}
@keyframes giro{to{rotate:360deg}}
.ill-foglio{position:absolute;left:50%;top:50%;width:54%;height:70%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;box-shadow:0 18px 40px -18px rgba(29,27,38,.4);padding:11%;display:grid;align-content:start;gap:7%}
.ill-foglio .r{display:flex;gap:8%;align-items:center}
.ill-foglio b{display:block;width:28%;aspect-ratio:1;border-radius:50%;background:center/cover no-repeat}
.ill-foglio i{display:block;height:5px;border-radius:5px;background:#e9e4dc}
.ill-foglio i.c{background:#3046b8;width:60%}
.ill-freccia{position:absolute;right:8%;bottom:6%;width:62px;height:62px;border-radius:50%;background:var(--brand-deep);color:#fff;display:grid;place-items:center;animation:rimbalza 1.4s var(--morbido) infinite}
@keyframes rimbalza{50%{transform:translateY(-8px)}}

/* ---------- Home: tutto in una schermata, stessa impostazione su telefono e computer ---------- */
.home-wrap{flex:1;min-height:0;width:100%;max-width:min(560px,66dvh);margin:0 auto;display:flex;flex-direction:column;padding-top:12px}
.home-wrap > .testata{flex:none}
.home-nav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-bottom:4px}
.home-nav .link{padding:8px 10px;font-size:14px}
.home-nav .nav-sx{justify-self:start;display:flex;gap:8px}.home-nav #h-azzera{justify-self:end}
.tondo-nav{width:42px;height:42px;margin-block:-3px;border-radius:50%;display:grid;place-items:center;color:var(--soft);background:var(--surface);box-shadow:0 1px 0 var(--line),0 6px 14px -10px rgba(29,27,38,.4);transition:transform .25s var(--molla),color .2s,background .2s}
.tondo-nav .icon{width:21px;height:21px}
.tondo-nav:hover{color:var(--ink);transform:translateY(-1px)}
.tondo-nav:active{transform:scale(.94)}
.tondo-nav.pericolo:hover{color:#b42f25;background:#fbeceb}
.tondo-nav.carica{pointer-events:none;opacity:.5}
.pallini{display:flex;gap:2px;--p:0}
.pal-wrap{display:flex;align-items:center;gap:6px}
.freccia-pan{display:none;width:36px;height:36px;margin-block:-3px;border-radius:50%;place-items:center;color:var(--ink);background:var(--surface);box-shadow:0 1px 0 var(--line),0 6px 14px -10px rgba(29,27,38,.4);transition:opacity .2s,transform .25s var(--molla)}
.freccia-pan .icon{width:19px;height:19px}
.freccia-pan:hover:not([disabled]){transform:translateY(-1px)}
.freccia-pan[disabled]{opacity:.3;cursor:default}
@media (hover:hover) and (pointer:fine){.freccia-pan{display:grid}}
.pallini button{width:30px;height:30px;display:grid;place-items:center}
.pallini i{display:block;height:8px;border-radius:8px;background:var(--line);transition:background .2s}
.pallini button:first-child i{width:calc(8px + 16px * (1 - var(--p)))}
.pallini button:last-child i{width:calc(8px + 16px * var(--p))}
.pallini button[aria-selected="true"] i{background:var(--brand)}
.pannelli{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pannelli::-webkit-scrollbar{display:none}
.pannello{flex:0 0 100%;min-width:0;min-height:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column}
.home{flex:1;min-height:0;overflow-y:auto;width:100%;display:flex;flex-direction:column;gap:12px;padding-top:12px;padding-bottom:10px}
.ant-corpo{flex:1;min-height:0;overflow-y:auto;padding-top:12px;padding-bottom:6px;overscroll-behavior-y:contain;touch-action:pan-x pan-y}
.ant-piede{flex:none;display:grid;gap:6px;padding-top:8px;padding-bottom:12px;border-top:1px solid var(--line);background:var(--bg)}
.ant-piede .riga{display:grid;grid-template-columns:1fr auto;gap:10px}
.ant-piede .btn{min-height:50px}
.ant-piede .avviso{margin:0;font-weight:500;font-size:14.5px;text-align:center}
.ant-piede .esito{font-size:13.5px;color:var(--soft);text-align:center}
.ant-piede .esito:empty{display:none}
.ant-piede .esito.err{color:#c4352b}
/* ---- anteprima del PDF ---- */
.carta{background:#fff;color:#1d1b26;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06),0 22px 40px -28px rgba(29,27,38,.45)}
.c-fascia{background:#f7f3ec;padding:18px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.c-foto{width:70px;height:70px;border-radius:50%;overflow:hidden;background:#e9e4dc;box-shadow:0 0 0 2px #fff,0 0 0 4px #3046b8}
.c-foto img{width:100%;height:100%;object-fit:cover}
.c-eti{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#82808a}
.c-nome{font-family:var(--f-titolo);font-weight:700;font-size:22px;line-height:1.1;letter-spacing:-.02em;margin:3px 0 2px}
.c-nome.segnaposto{color:#b9b4ac}
.c-anno{font-size:11.5px;color:#5b5766;line-height:1.35}
.c-pp{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.c-pp span{font-size:11px;font-weight:600;background:#fff;padding:3px 9px 3px 7px;border-radius:99px;display:inline-flex;align-items:center;gap:5px}
.c-pp span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.c-corpo{padding:16px;display:grid;gap:20px}
.c-testata{display:grid;grid-template-columns:minmax(0,1fr) 46%;gap:8px;align-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:10px;padding:12px 10px 12px 14px;min-height:82px}
.c-testata b{display:block;font-family:var(--f-titolo);font-size:24px;line-height:1;color:var(--deep)}
.c-testata span{display:block;font-family:var(--f-titolo);font-weight:700;font-size:13.5px;line-height:1.2;margin-top:5px}
.c-testata img{width:100%;max-height:70px;object-fit:contain}
.c-testo{display:flow-root;margin-top:12px}
.c-frase{margin:0 0 12px;font-style:italic;font-size:15px;line-height:1.45;position:relative;padding-left:26px}
.c-frase::before{content:"“";position:absolute;left:0;top:-6px;font-family:var(--f-titolo);font-size:40px;line-height:1;color:var(--c)}
.c-sopra{margin:12px 0 4px;font-family:var(--f-titolo);font-weight:700;font-size:13.5px;display:flex;gap:7px;align-items:center}
.c-sopra::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c);flex:none}
.c-q{margin:10px 0 3px;font-size:11.5px;font-weight:600;color:var(--deep);line-height:1.3}
.c-a{margin:0;font-size:13px;line-height:1.5;white-space:pre-wrap;border-left:2px solid color-mix(in srgb,var(--c) 45%,#fff);padding-left:10px}
.c-a.cit{border:0;padding-left:0;font-style:italic;font-size:14.5px}
.c-img{display:block;overflow:hidden;margin:4px 0 8px}
.c-img.uno{width:44%}
.c-img.dx{float:right;margin-left:12px}.c-img.sx{float:left;margin-right:12px}
.c-img img,.c-griglia img{width:100%;height:100%;object-fit:cover;display:block}
.c-img.f-tondo{border-radius:50%}.c-img.f-quadrato{border-radius:2px}.c-img.f-smussato{border-radius:9px}
.c-griglia{clear:both;display:grid;gap:5px;margin:10px 0 6px}
.c-griglia > span{overflow:hidden;border-radius:8px}
.c-griglia.n2{grid-template-columns:1fr 1fr}.c-griglia.n2 > span{aspect-ratio:1.39}
.c-griglia.n3{grid-template-columns:62fr 38fr;grid-template-rows:1fr 1fr}
.c-griglia.n3 > span:first-child{grid-row:1 / span 2}
.c-sez.vuota .c-testata{opacity:.5}
.c-vuota{margin:8px 0 0;font-size:12.5px;color:#a7a2ad;font-style:italic}
.c-nota{background:#f7f3ec;border-radius:10px;padding:14px;font-size:12px;font-style:italic;color:#5b5766;line-height:1.5}
.testata{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;flex:none}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--faint);overflow:hidden;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--line);transition:transform .3s var(--molla)}
.avatar:hover{transform:scale(1.05) rotate(-3deg)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.ok{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--brand)}
.testata h1{font-size:clamp(21px,5.4vw,26px);line-height:1.08}
.testata p{margin:2px 0 0;color:var(--soft);font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riepilogo{flex:none;background:var(--surface);border-radius:20px;padding:10px 10px 10px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;box-shadow:0 1px 0 var(--line),0 20px 40px -30px rgba(29,27,38,.4)}
.riep-riga{display:flex;align-items:center;gap:12px}
.riep-riga b{font-family:var(--f-titolo);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.riep-riga b small{font-size:14px;color:var(--faint)}
.riep-riga .barra{flex:1}
.riep-riga > span{color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums}
.barra{height:10px;border-radius:12px;background:var(--sunk);overflow:hidden}
.barra i{display:block;height:100%;border-radius:12px;background:var(--brand);width:0;transition:width 1.1s var(--molla)}
.riepilogo .btn{min-height:48px;padding:0 20px}
.sez-lista{flex:1;min-height:340px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:10px}
.sez{min-height:0;display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--surface);border-radius:18px;padding:6px 6px 8px;box-shadow:0 1px 0 var(--line),0 12px 24px -20px rgba(29,27,38,.45);transition:transform .35s var(--molla),box-shadow .3s;animation:sbuca .7s var(--molla) both;animation-delay:calc(var(--i) * 45ms)}
.sez:hover{transform:translateY(-2px);box-shadow:0 1px 0 var(--line),0 18px 28px -20px rgba(29,27,38,.55)}
.sez:active{transform:scale(.98)}
.sez .foto{position:relative;flex:1;min-height:0;width:100%;border-radius:13px;overflow:hidden;background:color-mix(in srgb,var(--deep) 11%,#fff)}
.sez .foto img{position:absolute;inset:3%;width:94%;height:94%;object-fit:contain;filter:var(--duo);transition:transform 1.1s var(--morbido)}
.sez.fatta,.sez.fatta:hover{background:color-mix(in srgb,var(--deep) 9%,#fff);box-shadow:inset 0 0 0 2px var(--deep),0 12px 24px -20px rgba(29,27,38,.45)}
.sez.fatta .foto .conto{background:var(--deep);color:#fff;display:grid;place-items:center;padding:5px}
.sez.fatta .foto .conto .icon{width:13px;height:13px;stroke-width:3}
.sez.fatta .foto::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:lucida 1.4s var(--morbido) calc(var(--i) * 45ms + .5s) both;pointer-events:none}
@keyframes lucida{to{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.sez.fatta .foto::after{display:none}}
.sez:hover .foto img{transform:scale(1.06)}
.sez .foto .num{position:absolute;left:6px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--surface);color:var(--deep);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.sez .foto .num .simbolo{width:15px;height:15px}
.sez .foto .num .icon{width:15px;height:15px;stroke-width:2.6}
.sez .foto .conto{position:absolute;right:6px;top:6px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--deep);background:var(--surface);padding:3px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.sez > .barra{flex:none;height:4px;margin:0 4px;background:color-mix(in srgb,var(--deep) 12%,#fff)}
.sez > .barra i{background:var(--deep)}
.sez h3{flex:none;padding:0 4px;font-size:clamp(12px,1.65dvh,14px);line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sez.tile-pdf{--deep:var(--brand-deep);background:var(--brand-deep);color:#fff;justify-content:center;align-items:center;text-align:center;gap:10px;padding:12px}
.sez.tile-pdf .tondino .icon{width:24px;height:24px}
.sez.tile-pdf .tondino{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.sez.tile-pdf h3{-webkit-line-clamp:3}
@media(max-height:700px){.sez .foto .num{display:none}.tut-ill{width:min(200px,26dvh)}.tut-corpo{gap:14px}.tut-corpo h1{font-size:26px}.tut-corpo p{font-size:15.5px}.riepilogo{padding-block:8px}}
.home-piede{flex:none;display:flex;justify-content:center;gap:4px;margin-top:-4px}
.home-piede .link{padding:6px 12px;font-size:14px}
.velo{position:fixed;inset:0;z-index:70;background:rgba(29,27,38,.38);display:grid;place-items:center;padding:20px;animation:entraSu .3s var(--morbido)}
.conferma{background:var(--surface);border-radius:20px;padding:20px;display:grid;gap:14px;text-align:center;max-width:380px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.conferma p{margin:0}
.conferma .riga{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- Domanda ---------- */
.q-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding-top:10px;padding-bottom:6px;max-width:760px;width:100%;margin:0 auto}
.q-top .barra{height:12px;background:color-mix(in srgb,var(--c) 18%,var(--sunk))}
.q-top .barra i{background:var(--c);transition:width .8s var(--molla)}
.salvato{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--soft);min-width:84px;justify-content:center;background:var(--surface);padding:6px 10px;border-radius:999px;box-shadow:0 2px 10px -4px rgba(0,0,0,.15)}
.salvato .icon{width:16px;height:16px;color:var(--ok)}
.salvato.no{color:#c4352b}
.q-corpo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.q-in{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-top:14px;padding-bottom:20px}
.etichetta-sez{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:13.5px;font-weight:600;color:var(--ink);background:var(--surface);padding:5px 12px 5px 5px;border-radius:999px;max-width:100%;box-shadow:0 2px 12px -6px rgba(0,0,0,.2)}
.etichetta-sez b{width:28px;height:28px;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;flex:none}
.etichetta-sez b .simbolo{width:17px;height:17px}
.etichetta-sez span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-meta{display:flex;align-items:center;justify-content:space-between;gap:12px}
.q-meta .etichetta-sez{min-width:0}
.q-num{font-size:13.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.q-num b{color:var(--ink)}
.q-in h1 .w{display:inline-block;animation:parola .6s var(--morbido) both;animation-delay:calc(var(--k) * 32ms + 120ms)}
@keyframes parola{from{opacity:0;transform:translateY(.45em);filter:blur(4px)}}
.q-in .sopra{margin:4px 0 -10px;font-size:15px;font-weight:500;color:var(--soft)}
.q-in h1{font-size:clamp(25px,6.4vw,34px);line-height:1.15}
.q-in .aiuto{margin:-4px 0 0;color:var(--soft);font-size:16px}
.campo{display:flex;flex-direction:column;flex:1;min-height:0}
.campo textarea,.campo input{width:100%;font:inherit;font-size:18px;line-height:1.6;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;transition:border-color .2s,box-shadow .2s}
.campo textarea{resize:none;flex:1;min-height:110px}
.campo.corto textarea{flex:none;height:150px;min-height:0}
.campo textarea:focus,.campo input:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.campo textarea::placeholder,.campo input::placeholder{color:var(--faint)}
.cinque{display:grid;gap:10px}
.parola{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0 8px 0 10px;transition:border-color .2s,box-shadow .2s,transform .3s var(--molla)}
.parola:focus-within{border-color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent);transform:scale(1.01)}
.parola b{width:30px;height:30px;border-radius:50%;background:var(--sunk);color:var(--soft);display:grid;place-items:center;font-family:var(--f-titolo);font-size:15px;flex:none;transition:background .3s,color .3s}
.parola.piena b{background:var(--deep);color:#fff}
.parola input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:18px;color:var(--ink);padding:14px 0;outline:none}
.parola input::placeholder{color:var(--faint)}
.foto-area{flex:1;display:grid;justify-items:center;align-content:center;gap:20px;padding-block:10px}
.foto-wrap{position:relative;isolation:isolate;padding:9px;border-radius:50%}
.foto-wrap::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c),color-mix(in srgb,var(--c) 30%,var(--bg)),var(--c));animation:giro 8s linear infinite;z-index:-1}
.foto-tonda{width:min(220px,56vw,30dvh);aspect-ratio:1;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--deep);overflow:hidden;box-shadow:0 0 0 4px var(--bg)}
.foto-tonda img{width:100%;height:100%;object-fit:cover;animation:sbuca .6s var(--molla) both}
.foto-tonda .icon{width:30%;height:30%;stroke-width:1.6}
.img-area{flex:1;display:grid;justify-items:center;align-content:center;gap:18px}
.img-riquadro{height:min(300px,34dvh);max-width:100%;border-radius:22px;background:var(--surface);border:2px dashed var(--line);display:grid;place-items:center;color:var(--deep);overflow:hidden}
.img-riquadro.piena{border:0}
.img-riquadro img{width:100%;height:100%;object-fit:cover;animation:sbuca .6s var(--molla) both}
.img-riquadro .icon{width:56px;height:56px;stroke-width:1.6}
.comandi{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.q-piede{border-top:1px solid var(--line);background:var(--bg)}
.q-piede-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:12px;padding-block:14px 16px}
.q-piede .btn.chiaro{padding:0 20px}

/* ---------- Fine sezione: il timbro ---------- */
.fine-ill{position:relative;width:min(360px,84vw,56dvh);aspect-ratio:2/1;border-radius:28px;background:color-mix(in srgb,var(--deep) 11%,#fff);flex:none;animation:sbuca .7s var(--molla) both}
.fine-ill{margin-bottom:9%}
.fine-ill > img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.fine-ill > img.duo{filter:var(--duo);animation:svela 1.2s ease 1.1s both}
@keyframes svela{to{opacity:0}}
.fine-ill .timbro{position:absolute;right:-6%;bottom:-22%;width:34%;height:auto;aspect-ratio:1}
.ill-img{position:absolute;inset:2%;width:96%;height:96%;object-fit:contain}
.fine{flex:1;min-height:0;padding-block:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;max-width:560px;margin:0 auto;width:100%;overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:none;touch-action:pan-y}
.timbro{width:min(190px,26dvh);height:min(190px,26dvh);flex:none;position:relative;color:var(--deep);animation:timbra .75s cubic-bezier(.2,.9,.3,1.2) .15s both;filter:drop-shadow(0 2px 0 rgba(255,255,255,.6))}
.timbro::before{content:"";position:absolute;inset:4px;border-radius:50%;background:color-mix(in srgb,var(--surface) 88%,transparent)}
.timbro svg.anello{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.timbro .centro{position:absolute;inset:30%;display:grid;place-items:center}
.timbro .centro .simbolo{width:66%;height:66%;stroke-width:2}
.timbro::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--c);opacity:0;animation:onda 1s ease-out .75s both}
@keyframes timbra{0%{transform:scale(2.4) rotate(-28deg);opacity:0}55%{transform:scale(.9) rotate(-9deg);opacity:1}75%{transform:scale(1.04) rotate(-11deg)}100%{transform:scale(1) rotate(-10deg);opacity:1}}
@keyframes onda{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.5)}}
.scuoti{animation:scuoti .32s ease-out .62s}
@keyframes scuoti{25%{transform:translate(2px,1px)}50%{transform:translate(-2px,-1px)}75%{transform:translate(1px,-1px)}}
.fine h1{font-size:clamp(25px,6.4vw,32px);line-height:1.15}
.fine p{margin:0;color:var(--soft)}
.fine .azioni{display:grid;gap:12px;width:100%;max-width:380px}
#coriandoli{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- PDF ---------- */
.pdf{flex:1;min-height:0;overflow-y:auto;display:flex}
.pdf-in{flex:1;width:100%;max-width:560px;margin:0 auto;padding-block:2px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:min-content}
.pdf-in h1{font-size:clamp(22px,5.6vw,28px);flex:none}
.pdf-in > *{flex:none}
.foglio{width:min(250px,64vw);aspect-ratio:210/297;background:#fff;color:#1d1b26;border-radius:8px;box-shadow:0 2px 0 #e6e0d6,0 30px 50px -28px rgba(29,27,38,.55);padding:8%;display:flex;flex-direction:column;gap:4%;text-align:left;animation:foglio 1s var(--molla) both;font-family:var(--f-testo)}
@keyframes foglio{from{transform:translateY(30px) rotate(-6deg);opacity:0}}
.foglio .cv-testa{display:flex;gap:7px;align-items:center}
.foglio .cv-chi{display:grid;gap:2px;min-width:0}
.foglio .cv-linea{height:1px;background:#e6e0d6}
.foglio .cv-sez{display:grid;gap:3px}
.foglio .cv-sez b{font-family:var(--f-titolo);font-size:6.5px;line-height:1.2}
.foglio .cv-sez i{display:block;height:2.5px;border-radius:3px;background:#e9e4dc}
.foglio .cv-sez i:first-of-type{width:55%}
.foglio .h{font-size:4.6px;letter-spacing:.06em;text-transform:uppercase;color:#767280}
.foglio .f{width:34px;height:34px;flex:none;border-radius:50%;background:#f2eee7;overflow:hidden;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #3046b8}
.foglio .f img{width:100%;height:100%;object-fit:cover}
.foglio .n{font-family:var(--f-titolo);font-weight:700;font-size:11px;line-height:1.1}
.foglio .pp{display:flex;flex-wrap:wrap;gap:2px}
.foglio .pp span{font-size:4.6px;padding:1px 4px;border-radius:9px;background:#e8ebfa;color:#24359a}
.pdf-in .avviso{margin:0;font-weight:500}
.sfondi{width:100%;display:grid;gap:7px;text-align:left}
.sfondi > b{font-size:15px;font-weight:600}
.sfondi-riga{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:4px 2px 6px}
.sfondi-riga .sf{width:auto}
.sfondi-riga::-webkit-scrollbar{display:none}
.sf{flex:none;width:52px;aspect-ratio:210/297;border-radius:8px;background:var(--surface) center/cover no-repeat;box-shadow:inset 0 0 0 1.5px var(--line);position:relative;transition:transform .3s var(--molla),box-shadow .2s}
.sf[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--brand);transform:translateY(-3px)}
.sf.nessuno{display:grid;place-items:center;color:var(--faint)}
.sf.nessuno .icon{width:22px;height:22px}
.sfondi .info{font-size:13.5px;color:var(--soft);min-height:20px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;min-width:0}
.seg button{flex:1 1 0;min-width:0;min-height:36px;line-height:1.15;text-align:center;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--soft);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,color .2s;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px -2px rgba(0,0,0,.2)}
.cat-sf{overflow-x:auto;scrollbar-width:none}
.cat-sf::-webkit-scrollbar{display:none}
.cat-sf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.cat-sf button{padding:0 4px;white-space:nowrap;font-size:13px}
.foglio{background:linear-gradient(#f7f3ec 0 34%,#fff 34%)}
.foglio .f{width:42px;height:42px;box-shadow:0 0 0 2px #f7f3ec,0 0 0 3.5px #3046b8}
.pdf-in .foglio{flex:1 1 0;min-height:130px;overflow:hidden;width:auto;max-width:62vw;aspect-ratio:210/297;padding:7%}
.pdf-in .azioni{display:grid;gap:12px;width:100%;max-width:380px}
.pdf-in .esito{min-height:20px;font-size:14px;color:var(--soft)}
.pdf-in .esito:empty{display:none}
.pdf-in .esito.err{color:#c4352b}
.pdf-in .nota{margin:0;color:var(--faint);font-size:13px;line-height:1.4;max-width:52ch}
.btn.chiaro .spin{border-color:var(--line);border-top-color:var(--ink)}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:giro .7s linear infinite}

/* ---------- Immagini: raccolta ed editor ---------- */
.giostra{width:100%;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 10px;max-width:100%;scrollbar-width:none;align-items:center;justify-content:safe center}
.giostra::-webkit-scrollbar{display:none}
.g-voce{position:relative;flex:none;scroll-snap-align:center}
.g-img{display:block;height:min(240px,30dvh);overflow:hidden;background:var(--sunk);box-shadow:0 18px 34px -22px rgba(0,0,0,.55)}
.g-img img{width:100%;height:100%;object-fit:cover}
.g-img.f-tondo{border-radius:50%}.g-img.f-quadrato{border-radius:4px}.g-img.f-smussato{border-radius:18px}
.g-togli{position:absolute;right:-6px;top:-6px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.g-togli .icon{width:16px;height:16px;stroke-width:2.6}
.g-aggiungi{flex:none;height:min(240px,30dvh);min-width:120px;border-radius:18px;border:2px dashed var(--line);background:var(--surface);color:var(--deep);display:grid;place-items:center;align-content:center;gap:8px;font-weight:600;font-size:15px;scroll-snap-align:center;padding:0 14px}
.g-aggiungi.stretto{min-width:0;width:104px;padding:0 8px;font-size:14px}
.g-aggiungi .icon{width:34px;height:34px;stroke-width:1.7}
.g-nota{margin:0;font-size:14px;color:var(--soft);text-align:center}
button.foto-tonda{padding:0;cursor:pointer}
.velo.editor{background:rgba(20,19,28,.72)}
.ed-box{width:min(440px,100%);max-height:100%;background:var(--surface);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.ed-box h2{font-size:20px;text-align:center}
.ed-campo{height:min(320px,42dvh);display:grid;place-items:center;background:repeating-conic-gradient(#efece6 0 25%,#f8f6f2 0 50%) 0 0/18px 18px;border-radius:16px}
.ed-cornice{overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--brand),0 18px 30px -18px rgba(0,0,0,.5);touch-action:none}
.ed-cornice canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.ed-cornice canvas:active{cursor:grabbing}
.ed-zoom{display:flex;align-items:center;gap:10px;color:var(--soft)}
.ed-zoom input{flex:1;accent-color:var(--brand)}
.ed-aiuto{margin:-4px 0 0;font-size:13.5px;color:var(--soft);text-align:center}
.ed-box .riga{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.timbro .centro.foto{inset:31%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--surface)}
.timbro .centro.foto img{width:100%;height:100%;object-fit:cover}

/* ---------- Aiutino ---------- */
.aiutino{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14.5px;color:var(--deep);background:color-mix(in srgb,var(--c) 14%,#fff);padding:7px 14px 7px 10px;border-radius:999px;margin-top:-4px;transition:transform .25s var(--molla)}
.aiutino:active{transform:scale(.96)}
.aiutino .icon{width:19px;height:19px}
.aiuto-velo{padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pop{width:min(460px,100%);max-height:calc(var(--app-h) - 32px);background:var(--surface);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:entraSu .35s var(--morbido)}
.pop-testa{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 18px}
.pop-eti{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--brand)}
.pop-eti .icon{width:19px;height:19px}
.pop-x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink);flex:none}
.pop-corpo{overflow-y:auto;padding:4px 20px 20px;display:grid;gap:10px}
.pop-corpo h2{font-size:19px;line-height:1.2}
.pop-sotto{margin:2px 0 0;color:var(--soft);font-size:15px}
.pop-corpo ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pop-corpo li{position:relative;padding:10px 12px 10px 34px;background:var(--bg);border-radius:12px;font-size:15.5px;line-height:1.4}
.pop-corpo li::before{content:"?";position:absolute;left:10px;top:9px;width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}

.pop-es b{font-size:13px;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.pop-es p{margin:4px 0 0;font-style:italic;line-height:1.45}

/* ---------- Indice e modifica dall'anteprima ---------- */
.q-num.indice{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);box-shadow:0 2px 10px -5px rgba(0,0,0,.25)}
.q-num.indice .icon{width:16px;height:16px;color:var(--deep)}
.indice-lista{display:grid;gap:6px}
.indice-lista button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:12px;background:var(--bg);font-size:15px;line-height:1.3}
.indice-lista button b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--soft);font-size:13px}
.indice-lista button b .icon{width:15px;height:15px;stroke-width:2.6}
.indice-lista button:has(.icon) b{background:var(--deep);color:#fff}
.indice-lista button.qui{box-shadow:inset 0 0 0 2px var(--deep);background:#fff}
.pop-campo{width:100%;font:inherit;font-size:16.5px;line-height:1.5;border:2px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical;color:var(--ink);background:#fff}
.pop-campo:focus{outline:none;border-color:var(--brand)}
.riga-pop{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.ant-nota{margin:0 0 8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--soft)}
.ant-nota .icon{width:16px;height:16px}
.carta [data-k]{cursor:pointer;border-radius:4px;transition:background .2s}
.carta [data-k]:hover,.carta [data-k]:focus-visible{background:#f3f1fb}
.carta button[data-img]{padding:0;cursor:pointer}
.c-foto{padding:0}
.c-griglia > button{overflow:hidden;border-radius:8px}
.c-griglia.n2 > button{aspect-ratio:1.3889}
.c-griglia.n3 > button:first-child{grid-row:1 / span 2;aspect-ratio:1.3831}
button.c-vuota{display:block;text-decoration:underline;text-underline-offset:3px}

/* ---------- Giro guidato ---------- */
.giro{position:fixed;inset:0;z-index:66}
.giro-luce{position:fixed;border-radius:18px;box-shadow:0 0 0 3px #fff,0 0 0 9999px rgba(29,27,38,.62);transition:top .45s var(--morbido),left .45s var(--morbido),width .45s var(--morbido),height .45s var(--morbido);pointer-events:none}
.giro-bolla{position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));max-width:420px;margin:0 auto;background:var(--surface);border-radius:20px;padding:12px 14px 12px 16px;display:grid;gap:8px;box-shadow:0 24px 50px -18px rgba(0,0,0,.55);opacity:0;transform:translateY(8px);transition:top .45s var(--morbido)}
.giro-bolla.su{opacity:1;transform:none;transition:top .45s var(--morbido),opacity .3s,transform .4s var(--molla)}
.giro-testa{display:flex;align-items:center;justify-content:space-between}
.giro-n{font-size:12.5px;font-weight:700;color:#fff;background:var(--brand);padding:3px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.giro-x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink)}
.giro-t{margin:0;font-size:16px;line-height:1.45}
.giro-piede{display:flex;align-items:center;justify-content:space-between}

/* ---------- Suggerimenti sul posto ---------- */
.tip{position:fixed;z-index:60;max-width:260px;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:grid;gap:10px;font-size:15px;line-height:1.4;box-shadow:0 20px 40px -16px rgba(0,0,0,.45);animation:tip .5s var(--molla) both}
@keyframes tip{from{transform:translateY(8px) scale(.9);opacity:0}}
.tip::before{content:"";position:absolute;width:14px;height:14px;background:var(--ink);transform:rotate(45deg);left:var(--ax,24px)}
.tip.sotto::before{top:-6px}
.tip.sopra::before{bottom:-6px}
.tip button{justify-self:end;font-weight:600;font-size:14px;color:var(--bg);background:color-mix(in srgb,var(--bg) 18%,transparent);padding:7px 14px;border-radius:10px}
.evidenzia{position:relative;z-index:55;animation:pulsa 1.6s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--brand) 30%,transparent)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:90;background:var(--ink);color:var(--bg);font-weight:500;font-size:15px;padding:12px 20px;border-radius:16px;transition:.35s var(--molla);pointer-events:none;max-width:calc(100vw - 36px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

<script>

const TUTORIAL = [

/* Simboli delle sezioni (stesso tratto, come timbri) */

const ESP = "Che cosa è accaduto? Perché è importante? Che cosa ti ha lasciato?";
/* Aiutini: domande brevi ed esempi per sbloccare chi fatica a cominciare */
const AIUTINI = {
  presentazioneBreve:{ d:["Se dovessi presentarti in dieci secondi, cosa diresti?","Cosa fai quando non studi?","Da dove vieni, e cosa ti porti dietro?"], e:"Vengo da un paese di montagna e ho sempre fatto da guida ai più piccoli: adesso voglio farlo per mestiere." },
  parole:{ d:["Come ti descriverebbe la persona che ti conosce meglio?","Quale parola usi per il tuo modo di affrontare un problema?","Pensa a un pregio e a un difetto: valgono entrambi."], e:"curiosa, paziente, testarda, ironica, disordinata" },
  aspettoImportante:{ d:["Cosa ti mette in difficoltà più spesso di quanto vorresti?","C'è un tratto di te che gli altri fraintendono?","Cosa hai imparato a gestire con il tempo?"], e:"Sono molto timida: per anni ho evitato di parlare in pubblico. Ho imparato a prepararmi e a chiedere aiuto, e oggi la timidezza mi rende più attenta a chi resta in silenzio." },

  commentoCitazione:{ d:["Quando l'hai letta o sentita la prima volta?","In quale situazione ti è tornata in mente?","Cosa ti dice oggi, che allora non ti diceva?"], e:"L'ho letta al primo anno: mi ha fatto capire che aiutare non vuol dire sostituirsi all'altro, ma dargli gli strumenti." },

function generaSfondo(tipo){
  const W = 700, H = 990, c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");

  const macchie = (colori, n, r) => { for (let i = 0; i < n; i++){ const x = Math.random() * W, y = Math.random() * H, rr = r * (.5 + Math.random()); const gr = g.createRadialGradient(x, y, 0, x, y, rr); gr.addColorStop(0, colori[i % colori.length]); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, W, H); } };
  if (tipo === "acquerello"){ g.fillStyle = "#f7f1e6"; g.fillRect(0,0,W,H); macchie(["rgba(233,165,47,.18)","rgba(70,169,187,.16)","rgba(217,86,106,.12)","rgba(111,106,216,.12)"], 14, 260); rumore(18); }
  else if (tipo === "kraft"){ g.fillStyle = "#d8c3a0"; g.fillRect(0,0,W,H); rumore(30); g.strokeStyle = "rgba(120,90,50,.08)"; for (let i = 0; i < 900; i++){ const x = Math.random() * W, y = Math.random() * H, l = 6 + Math.random() * 22, a = Math.random() * Math.PI; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); } }
  else {
    const set = { alba:["#ffd9c2","#ffeedd","#f2d4f0"], menta:["#cfeee2","#eaf7f1","#cfe6f7"], lavanda:["#e0d8fa","#f3effd","#f9dcea"] }[tipo];
    const gr = g.createLinearGradient(0, 0, W * .4, H); gr.addColorStop(0, set[0]); gr.addColorStop(.55, set[1]); gr.addColorStop(1, set[2]);
    g.fillStyle = gr; g.fillRect(0, 0, W, H); macchie([set[0], set[2]], 5, 420); rumore(10, true);

}

  const via = (x, y, t) => { if (t && t.closest && t.closest("textarea,input")) return; x0 = x; y0 = y; };
  const fine = (x, y) => { if (x0 === null) return; const dx = x - x0, dy = y - y0; x0 = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) (dx < 0 ? avanti : indietro)(); };
  el.addEventListener("touchstart", e => via(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive:true });
  el.addEventListener("touchend", e => fine(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive:true });
  el.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") via(e.clientX, e.clientY, e.target); });
  el.addEventListener("pointerup", e => { if (e.pointerType === "mouse") fine(e.clientX, e.clientY); });
}

function chiedi(testo, si, no, pericolo){

  { sel:".sez-lista .sez", pan:0, t:"Ogni riquadro è una tappa del tuo profilo. Toccalo per compilarla: quando la completi, compare la spunta." },
  { sel:"#h-continua", pan:0, t:"Continua ti porta dritto alla prossima domanda da compilare." },

];
function giroGuidato(sc, vai){
  const g = document.createElement("div"); g.className = "giro";
  g.innerHTML = `<div class="giro-luce"></div><div class="giro-bolla" role="dialog" aria-modal="true" aria-live="polite">
    <div class="giro-testa"><span class="giro-n"></span><button class="giro-x" aria-label="Chiudi la guida">${ico("x")}</button></div>
    <p class="giro-t"></p>
    <div class="giro-piede"><button class="link giro-salta">Salta</button><button class="btn brand piccolo giro-avanti"><span>Avanti</span> ${ico("next")}</button></div></div>`;
  document.body.appendChild(g);
  const luce = $(".giro-luce", g), bolla = $(".giro-bolla", g);
  let i = 0, pan = 0;
  const fine = () => { g.remove(); removeEventListener("resize", posa); S.visto.giro = true; salva(true); if (pan) vai(0); };
  const posa = () => {
    const passo = GIRO[i], el = $(passo.sel, sc); if (!el) return;
    let r = el.getBoundingClientRect();
    const vis = { t:Math.max(8, r.top), b:Math.min(innerHeight - 8, r.bottom) };
    const m = 6, top = vis.t - m, h = Math.max(30, vis.b - vis.t) + m * 2;
    Object.assign(luce.style, { top: top + "px", left: (r.left - m) + "px", width: (r.width + m * 2) + "px", height: h + "px" });
    const bh = bolla.offsetHeight, sotto = top + h + 12 + bh < innerHeight - 8, sopra = top - bh - 12 > 8;
    bolla.style.top = (sotto ? top + h + 12 : sopra ? top - bh - 12 : innerHeight - bh - 16) + "px";
  };
  const mostraPasso = () => {
    const passo = GIRO[i];
    $(".giro-n", g).textContent = `${i + 1} / ${GIRO.length}`;
    $(".giro-t", g).textContent = (API && (S.utente ? passo.tl : passo.to)) || passo.t;
    $(".giro-avanti span", g).textContent = i === GIRO.length - 1 ? "Fine" : "Avanti";
    const attesa = passo.pan !== pan ? 500 : 0;
    if (attesa){ pan = passo.pan; vai(pan); }
    bolla.classList.remove("su"); void bolla.offsetWidth;
    setTimeout(() => { posa(); bolla.classList.add("su"); $(".giro-avanti", g).focus({ preventScroll:true }); }, attesa);
    if (attesa){ setTimeout(posa, attesa + 300); setTimeout(posa, attesa + 700); }
  };
  $(".giro-avanti", g).onclick = () => { if (i < GIRO.length - 1){ i++; mostraPasso(); } else fine(); };
  $(".giro-salta", g).onclick = fine; $(".giro-x", g).onclick = fine;
  addEventListener("resize", posa);
  mostraPasso();
}

/* anteprima leggibile del PDF: stessa impostazione, si riempie man mano */
function anteprima(){
  const foto = vistaFoto(), nome = (S.campi.nome || "").trim(), anno = (S.campi.annoCorso || "").trim(), frase = (S.campi.presentazioneBreve || "").trim();
  const pp = PAROLE.map(k => (S.campi[k] || "").trim()).filter(Boolean);
  const immagini = (q) => {
    const voci = lista(q.key); if (!voci.length) return "";
    if (voci.length === 1){ const it = voci[0]; return `<button class="c-img uno ${q.posto.lato} f-${it.forma}" data-img="${q.key}:0" aria-label="Sistema l'immagine" style="aspect-ratio:${rapportoDi(it.forma, q.posto)}"><img src="${it.vista || it.data}" alt=""></button>`; }
    return `<span class="c-griglia n${voci.length}">${voci.map((it, n) => `<button data-img="${q.key}:${n}" aria-label="Sistema l'immagine ${n + 1}"><img src="${it.vista || it.data}" alt=""></button>`).join("")}</span>`;
  };
  const sezione = z => {
    const piene = chiaviSez(z).filter(k => !NON_IN_CORPO.includes(k)).some(ha) || (z.n === 1 && frase);
    let corpo = "", sopra = null;
    if (z.n === 1 && frase) corpo += `<p class="c-frase" data-k="presentazioneBreve" role="button" tabindex="0">${esc(frase)}</p>`;
    const ancore = {}; z.passi.forEach(q => { if (q.tipo === "immagine" && q.ancora && lista(q.key).length && ha(q.ancora)) ancore[q.ancora] = q; });
    const messe = new Set();
    for (const p of z.passi){
      if (p.tipo === "foto" || p.tipo === "parole" || NON_IN_CORPO.includes(p.key)) continue;
      if (p.tipo === "immagine"){ if (!messe.has(p.key)) corpo += immagini(p); continue; }
      const v = (S.campi[p.key] || "").trim(); if (!v) continue;
      const an = ancore[p.key], fila = an && lista(an.key).length > 1;
      if (an && !fila){ corpo += immagini(an); messe.add(an.key); }
      if (p.sopra && p.sopra !== sopra){ corpo += `<p class="c-sopra">${esc(p.sopra)}</p>`; sopra = p.sopra; }
      corpo += `<p class="c-q">${esc(p.titolo)}</p><p class="c-a ${p.key === "citazione" ? "cit" : ""}" data-k="${p.key}" role="button" tabindex="0">${esc(v)}</p>`;
      if (fila){ corpo += immagini(an); messe.add(an.key); }
    }
    return `<div class="c-sez ${piene ? "" : "vuota"}" style="--c:${z.c};--deep:${z.deep}">
      <div class="c-testata"><div><b>${String(z.n).padStart(2, "0")}</b><span>${esc(z.titolo)}</span></div><img src="${fotoSez(z.n)}" style="filter:url(#duo-${z.n})" alt=""></div>
      ${piene ? `<div class="c-testo">${corpo}</div>` : `<button class="c-vuota" data-vai="${z.n - 1}">Ancora vuota</button>`}</div>`;
  };
  return `<p class="ant-nota">${ico("matita")} Tocca un testo o un'immagine per modificarli.</p><div class="carta" aria-label="Anteprima del PDF">
    <div class="c-fascia"><button class="c-foto" data-img="foto" aria-label="Sistema la foto">${foto ? `<img src="${foto}" alt="">` : ""}</button>
      <div><div class="c-eti">${esc(TESTI.titolo)}</div><div class="c-nome ${nome ? "" : "segnaposto"}" data-k="nome" role="button" tabindex="0">${esc(nome || "Nome e cognome")}</div>
      <div class="c-anno" data-k="annoCorso" role="button" tabindex="0">${esc(anno ? anno + " · " + TESTI.sottotitolo : TESTI.sottotitolo)}</div>
      ${pp.length ? `<div class="c-pp">${pp.map((w, i) => { const z = SEZ[i % SEZ.length]; return `<span style="--c:${z.c};color:${z.deep}">${esc(w)}</span>`; }).join("")}</div>` : ""}</div></div>
    <div class="c-corpo">${SEZ.map(sezione).join("")}<div class="c-nota">${esc(TESTI.notaFinale)}</div></div>
  </div>`;
}

const cacheSfondo = {};
async function sfondoLavato(k){
  const x = SFONDI.find(z => z.k === k); if (!x) return null;
  if (cacheSfondo[k]) return cacheSfondo[k];

  const sc = Math.max(W / im.width, H / im.height), w = im.width * sc, h = im.height * sc;
  g.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);

function simboloPng(n, colore, lato = 160){
  const c = document.createElement("canvas"); c.width = c.height = lato; const x = c.getContext("2d");
  x.fillStyle = colore; x.beginPath(); x.arc(lato/2, lato/2, lato/2, 0, 7); x.fill();
  x.save(); const k = lato * .6 / 24; x.translate(lato * .2, lato * .2); x.scale(k, k);
  x.strokeStyle = "#fff"; x.lineWidth = 2; x.lineCap = "round"; x.lineJoin = "round";

}

/* ---------- elementi grafici del PDF, disegnati al momento ---------- */
const PXMM = 8; // risoluzione delle immagini generate: 8 pixel per millimetro
const cacheDuo = {};
async function illustrazioneDuo(s){
  if (cacheDuo[s.n]) return cacheDuo[s.n];
  const im = await caricaImg(fotoSez(s.n)), c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
  const x = c.getContext("2d"); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), q = d.data, a = rgb(s.deep), b = mix(s.c, .14);
  for (let i = 0; i < q.length; i += 4){ const l = (q[i] * .3 + q[i+1] * .59 + q[i+2] * .11) / 255; q[i] = a[0] + (b[0] - a[0]) * l; q[i+1] = a[1] + (b[1] - a[1]) * l; q[i+2] = a[2] + (b[2] - a[2]) * l; }
  x.putImageData(d, 0, 0);
  return (cacheDuo[s.n] = c);
}
function contieni(x, im, bx, by, bw, bh){ const k = Math.min(bw / im.width, bh / im.height), w = im.width * k, h = im.height * k; x.drawImage(im, bx + (bw - w) / 2, by + (bh - h) / 2, w, h); }
/* riquadro colorato con l'illustrazione in bicromia (testata di sezione) */
async function riquadroSez(s, wmm, hmm, area, raggio = 3.5){
  const c = document.createElement("canvas"); c.width = Math.round(wmm * PXMM); c.height = Math.round(hmm * PXMM); const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.beginPath(); x.roundRect(0, 0, c.width, c.height, raggio * PXMM); x.fillStyle = hex(mix(s.c, .14)); x.fill();
  const [ax, ay, aw, ah] = area.map((v, i) => v * (i % 2 ? c.height : c.width));
  contieni(x, await illustrazioneDuo(s), ax, ay, aw, ah);
  return c.toDataURL("image/jpeg", .9);
}
/* --- PDF impaginato come una rivista: fascia di apertura con la foto, una testata per sezione --- */
async function generaPDF(modo = "scarica"){
  const btn = $(modo === "condividi" ? "#p-condividi" : "#p-genera"), es = $("#p-esito");
  if (!S.img.foto?.data){ es.textContent = TESTI.serveFoto; return; }
  const etich = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = `<span class="spin" aria-hidden="true"></span>`; es.className = "esito"; es.textContent = "";
  try {
    const [jsPDF, fT, fR, fRI, fS] = await Promise.all([attendiLib(), ttf("tit-700"), ttf("txt-400"), ttf("txt-400i"), ttf("txt-600")]);
    if (document.fonts) await document.fonts.load('600 20px "Figtree EP"').catch(() => {});
    const doc = new jsPDF({ unit:"mm", format:"a4", compress:true });
    doc.addFileToVFS("T.ttf", fT); doc.addFont("T.ttf", "Titolo", "normal");
    doc.addFileToVFS("R.ttf", fR); doc.addFont("R.ttf", "Testo", "normal");
    doc.addFileToVFS("RI.ttf", fRI); doc.addFont("RI.ttf", "Testo", "italic");
    doc.addFileToVFS("RS.ttf", fS); doc.addFont("RS.ttf", "Testo", "bold");
    const W = 210, H = 297, M = 18, CW = W - 2 * M, BASSO = H - 22, STACCO = 7, RIENTRO = 5;
    const INK = [29,27,38], SOFT = [91,87,102], FAINT = [130,124,138], BRAND = [48,70,184], CREMA = [247,243,236];
    const nome = (S.campi.nome || "").trim();
    let y = M, pag = 1, fl = null, barra = null;
    const piede = () => {
      SEZ.forEach((z, i) => { doc.setFillColor(...rgb(z.c)); doc.circle(M + 1.1 + i * 3.1, H - 11.3, 1.05, "F"); });
      doc.setFont("Testo","bold"); doc.setFontSize(7.5); doc.setTextColor(...FAINT);
      doc.text(`E-Portfolio SFP${nome ? "  ·  " + nome : ""}`, M + 25, H - 10.2);
      doc.setFillColor(...CREMA); doc.roundedRect(W - M - 10, H - 14.4, 10, 6.4, 3.2, 3.2, "F");
      doc.setTextColor(...INK); doc.text(String(pag), W - M - 5, H - 10.2, { align:"center" });
    };
    const nuova = () => { doc.addPage(); pag++; piede(); y = M; fl = null; };
    const serve = h => { if (y + h > BASSO) nuova(); };
    const lh = pt => pt * .3528 * 1.5;
    const accanto = () => fl && y < fl.fondo;
    const rientro = () => barra ? RIENTRO : 0;
    const disponibile = () => (accanto() ? CW - fl.w - STACCO : CW) - rientro();
    const x0 = () => (accanto() && fl.lato === "sx" ? M + fl.w + STACCO : M) + rientro();
    const chiudiFloat = () => { if (fl){ y = Math.max(y, fl.fondo + 2); fl = null; } };
    const scrivi = (t, { font = "Testo", st = "normal", size = 10.5, col = INK, dopo = 0, x = null, larg = null } = {}) => {
      doc.setFont(font, st); doc.setFontSize(size); doc.setTextColor(...col);
      const h = lh(size), dx = () => x ?? x0(), dw = () => larg ?? disponibile();
      for (const paragrafo of String(t).replace(/\r/g, "").split("\n")){
        const parole = paragrafo.split(/\s+/).filter(Boolean);
        if (!parole.length){ y += h * .5; continue; }
        let riga = "";
        const emetti = r => { serve(h); if (barra){ doc.setFillColor(...barra); doc.rect(x0() - RIENTRO, y, .8, h, "F"); } doc.text(r, dx(), y + h * .74); y += h; };
        for (const w of parole){
          const prova = riga ? riga + " " + w : w;
          if (riga && doc.getTextWidth(prova) > dw()){ emetti(riga); riga = w; } else riga = prova;
          while (doc.getTextWidth(riga) > dw() && riga.length > 1){ let k = riga.length - 1; while (k > 1 && doc.getTextWidth(riga.slice(0, k)) > dw()) k--; emetti(riga.slice(0, k)); riga = riga.slice(k); }
        }
        if (riga) emetti(riga);
      }
      y += dopo;
    };

    /* ===== Copertina: fascia crema con foto, nome, anno e cinque parole ===== */
    piede();
    const D = 44, FY = 22;
    const pp = PAROLE.map(k => (S.campi[k] || "").trim()).filter(Boolean);
    const X = M + D + 10, LW = W - M - X;
    doc.setFont("Titolo","normal"); doc.setFontSize(30);
    const righeNome = doc.splitTextToSize(nome || TESTI.titolo, LW).slice(0, 2);
    let ty = FY + 9;
    const altoTesto = 9 + righeNome.length * 11 + 6 + (pp.length ? 12 : 0);
    const fascia = Math.max(FY + D + 16, FY + altoTesto + 10);
    doc.setFillColor(...CREMA); doc.rect(0, 0, W, fascia, "F");
    doc.setFillColor(...BRAND); doc.circle(M + D / 2, FY + D / 2, D / 2 + 1.6, "F");
    doc.setFillColor(255, 255, 255); doc.circle(M + D / 2, FY + D / 2, D / 2 + .6, "F");
    doc.addImage(await immagineFinale(S.img.foto, 1, "tondo", 640, true), "PNG", M, FY, D, D, undefined, "FAST");
    doc.setFont("Testo","bold"); doc.setFontSize(7.5); doc.setTextColor(...FAINT); doc.setCharSpace(.5);
    doc.text(TESTI.titolo.toUpperCase(), X, ty); doc.setCharSpace(0); ty += 11;
    doc.setFont("Titolo","normal"); doc.setFontSize(30); doc.setTextColor(...INK);
    righeNome.forEach(r => { doc.text(r, X, ty); ty += 11; });
    const anno = (S.campi.annoCorso || "").trim();
    doc.setFont("Testo","normal"); doc.setFontSize(10.5); doc.setTextColor(...SOFT);
    doc.text(anno ? `${anno}  ·  ${TESTI.sottotitolo}` : TESTI.sottotitolo, X, ty - 4, { maxWidth:LW }); ty += 3;
    if (pp.length){
      doc.setFont("Testo","bold"); doc.setFontSize(9);
      let px = X, py = ty + 2;
      pp.forEach((w, i) => {
        const col = SEZ[i % SEZ.length], lw = doc.getTextWidth(w) + 8;
        if (px + lw > W - M){ px = X; py += 9; }
        doc.setFillColor(255, 255, 255); doc.roundedRect(px, py - 5.2, lw, 7.6, 3.8, 3.8, "F");
        doc.setFillColor(...rgb(col.c)); doc.circle(px + 3.4, py - 1.4, 1.1, "F");
        doc.setTextColor(...rgb(col.deep)); doc.text(w, px + 5.4, py); px += lw + 2.5;
      });
    }
    y = fascia + 12;
    const frase = (S.campi.presentazioneBreve || "").trim();
    const presenti = SEZ.filter(s => (s.n === 1 && frase) || chiaviSez(s).filter(k => !NON_IN_CORPO.includes(k)).some(ha));

    /* ===== Sezioni ===== */
    let prima = true;
    for (const s of presenti){
      if (!prima){ if (y + 120 > BASSO) nuova(); else y += 12; }
      prima = false;
      const D2 = rgb(s.deep), tinta = mix(s.c, .45);
      const HT = 46;
      doc.addImage(await riquadroSez(s, CW, HT, [.44, .1, .54, .8]), "JPEG", M, y, CW, HT, undefined, "FAST");
      doc.setFont("Titolo","normal"); doc.setFontSize(34); doc.setTextColor(...D2); doc.text(String(s.n).padStart(2, "0"), M + 8, y + 17);
      doc.setFontSize(15.5); doc.setTextColor(...INK);
      doc.splitTextToSize(s.titolo, CW * .42).slice(0, 3).forEach((r, i) => doc.text(r, M + 8, y + 26 + i * 6.4));
      y += HT + 9;
      if (s.n === 1 && frase){
        /* la frase di presentazione apre "In primo piano" */
        doc.setFont("Titolo","normal"); doc.setFontSize(54); doc.setTextColor(...rgb(s.c)); doc.text("“", M - 1, y + 14);
        scrivi(frase, { st:"italic", size:14.5, col:INK, x:M + 15, larg:CW - 15, dopo:9 });
      }
      let ultimoSopra = null;
      const messe = new Set();
      const ancore = {}; s.passi.forEach(q => { if (q.tipo === "immagine" && q.ancora && lista(q.key).length && ha(q.ancora)) ancore[q.ancora] = q; });
      const metti = async q => {
        const voci = lista(q.key); if (!voci.length || messe.has(q.key)) return; messe.add(q.key);
        chiudiFloat();
        if (voci.length === 1){
          const it = voci[0], r = rapportoDi(it.forma, q.posto), w = it.forma === "smussato" ? q.posto.w : Math.min(q.posto.w, 54), h = w / r;
          if (y + h > BASSO) nuova();
          doc.addImage(await immagineFinale(it, r, it.forma, 1000, true, 3 / w), "PNG", q.posto.lato === "sx" ? M : W - M - w, y + .8, w, h, undefined, "FAST");
          fl = { fondo: y + .8 + h + 4, w, lato: q.posto.lato };
          return;
        }
        /* più immagini: celle rettangolari con angoli smussati, il ritaglio scelto resta al centro */
        const gap = 3, celle = [];
        if (voci.length === 2){ const w = (CW - gap) / 2, h = w * .72; celle.push([M, 0, w, h], [M + w + gap, 0, w, h]); }
        else { const H3 = 78, wb = CW * .62, ws = CW - wb - gap, hs = (H3 - gap) / 2; celle.push([M, 0, wb, H3], [M + wb + gap, 0, ws, hs], [M + wb + gap, hs + gap, ws, hs]); }
        const alt = Math.max(...celle.map(c => c[1] + c[3]));
        if (y + alt > BASSO) nuova();
        for (let n = 0; n < celle.length; n++){
          const [cx, cy, cw, ch] = celle[n];
          doc.addImage(await immagineFinale(voci[n], cw / ch, "smussato", Math.round(cw * 9), true, 3 / cw), "PNG", cx, y + cy, cw, ch, undefined, "FAST");
        }
        y += alt + 8;
      };
      for (const p of s.passi){
        if (p.tipo === "foto" || p.tipo === "parole" || NON_IN_CORPO.includes(p.key)) continue;
        if (p.tipo === "immagine"){ await metti(p); continue; }
        const v = (S.campi[p.key] || "").trim(); if (!v) continue;
        const an = ancore[p.key], fila = an && lista(an.key).length > 1;
        if (an && !fila){ serve(40); await metti(an); }
        if (p.sopra && p.sopra !== ultimoSopra){
          serve(lh(12) + lh(9.5) + lh(10.5) * 2 + 4); y += 1;
          doc.setFillColor(...rgb(s.c)); doc.roundedRect(x0(), y + 1.3, 2.6, 2.6, .6, .6, "F");
          scrivi(p.sopra, { font:"Titolo", size:12, col:INK, x:x0() + 5, larg:disponibile() - 5, dopo:2 }); ultimoSopra = p.sopra;
        }
        if (p.key === "citazione"){
          serve(lh(9.5) + lh(13) * 2 + 4);
          scrivi(p.titolo, { st:"bold", size:9.5, col:D2, dopo:1.2 });
          const y0 = y; doc.setFont("Titolo","normal"); doc.setFontSize(40); doc.setTextColor(...mix(s.c, .55)); doc.text("“", x0() - .5, y0 + 11);
          scrivi(v, { st:"italic", size:13, col:INK, x:x0() + 11, larg:disponibile() - 11, dopo:6 });
          continue;
        }
        doc.setFont("Testo","normal"); doc.setFontSize(10.5);
        const alto = lh(9.5) + 1 + v.split("\n").reduce((n, par) => n + Math.max(1, doc.splitTextToSize(par, CW - RIENTRO - (accanto() ? fl.w + STACCO : 0)).length), 0) * lh(10.5);
        serve(alto < 70 ? alto : lh(9.5) + lh(10.5) * 3);
        scrivi(p.titolo, { st:"bold", size:9.5, col:D2, dopo:1 });
        barra = tinta; scrivi(v, { size:10.5, col:INK, dopo:0 }); barra = null; y += 6;
        if (fila) await metti(an);
      }
      chiudiFloat();
    }

    /* ===== Chiusura ===== */
    doc.setFont("Testo","italic"); doc.setFontSize(10);
    const nl = doc.splitTextToSize(TESTI.notaFinale, CW - 20), bh = nl.length * lh(10) + 16;
    if (y + bh + 6 > BASSO) nuova();
    y += 4; doc.setFillColor(...CREMA); doc.roundedRect(M, y, CW, bh, 4, 4, "F");
    SEZ.forEach((z, i) => { doc.setFillColor(...rgb(z.c)); doc.circle(M + 10 + i * 3.4, y + 7, 1.15, "F"); });
    doc.setTextColor(...SOFT); nl.forEach((r, i) => doc.text(r, M + 10, y + 14.5 + i * lh(10)));

    const file = `profilo-personale${nome ? "-" + slug(nome) : ""}.pdf`;
    const blob = doc.output("blob");
    const r = modo === "condividi" ? await condividi(file, blob) : await offri(file, blob);
    es.className = r === "errore" ? "esito err" : "esito";
    es.textContent = r === "ok" ? file : r === "annullato" ? "" : modo === "condividi" ? "Non è stato possibile condividere il PDF. Prova a scaricarlo." : "Non è stato possibile scaricare il PDF. Riprova.";
    if (r === "ok") coriandoli();
  } catch(err){
    console.error(err); es.className = "esito err";
    es.textContent = err && err.message === "lib" ? "Connessione assente: il PDF non si può generare ora. Riprova tra poco." : "Non è stato possibile generare il PDF. Riprova.";
  } finally { btn.disabled = false; btn.innerHTML = etich; }
}

let tipAttivo = null;
function chiudiTip(){ if (!tipAttivo) return; tipAttivo.el.remove(); tipAttivo.target.classList.remove("evidenzia"); tipAttivo = null; }
function tip(target, testo, poi){
  if (!target) return; chiudiTip();
  const el = document.createElement("div");
  el.className = "tip"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", testo);
  el.innerHTML = `<span>${esc(testo)}</span><button>Ho capito</button>`;
  document.body.appendChild(el);
  target.classList.add("evidenzia");
  const r = target.getBoundingClientRect(), tw = el.offsetWidth, th = el.offsetHeight;
  const sotto = r.bottom + th + 20 < innerHeight;
  const left = Math.min(Math.max(12, r.left + r.width / 2 - tw / 2), innerWidth - tw - 12);
  el.style.left = left + "px";
  el.style.top = Math.max(12, sotto ? r.bottom + 14 : r.top - th - 14) + "px";
  el.classList.add(sotto ? "sotto" : "sopra");
  el.style.setProperty("--ax", Math.min(tw - 26, Math.max(12, r.left + r.width / 2 - left - 7)) + "px");
  tipAttivo = { el, target };
  el.querySelector("button").onclick = () => { chiudiTip(); if (poi) poi(); };
  el.querySelector("button").focus({ preventScroll:true });
}
